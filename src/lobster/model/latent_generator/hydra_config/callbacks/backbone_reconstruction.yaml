backbone_reconstruction:
  _target_: lobster.model.latent_generator.callbacks.BackboneReconstruction
  structure_path: "${paths.output_dir}/structures/"
  save_every_n: 10000
  use_extended_element_vocab: false
  # Ligand minimization options
  minimize_ligand: false
  minimize_mode: "bonds_and_angles"  # "bonds_only" or "bonds_and_angles"
  force_field: "MMFF94"
  minimize_steps: 500
