# WandB Sweep Configuration for Distributed ESMFold Baseline
# 
# This config distributes ESMFold baseline evaluation across multiple jobs.
# Each job processes a subset of input structure files.
#
# Example: 449 structure files with 5 structures per job = 90 jobs
#
# Generate this file using:
#   python src/lobster/cmdline/distributed_generation/create_job_config.py \
#     --mode esmfold_baseline \
#     --input_structures "/data2/lisanzas/multi_flow_data/test_set_filtered_pt/*.pt" \
#     --structures_per_job 5 \
#     --base_config src/lobster/hydra_config/experiment/esmfold_baseline.yaml

program: src/lobster/cmdline/distributed_esmfold_baseline.py
method: grid
project: lobster-esmfold-baseline
entity: prescient-design
metric:
  name: job_completed
  goal: maximize
parameters:
  base_config_path:
    value: src/lobster/hydra_config/experiment/esmfold_baseline.yaml
  job_id:
    # Example: 90 jobs for 449 structures with 5 structures per job
    # Adjust this list based on your actual number of jobs
    # Use create_job_config.py to auto-generate or manually list all job IDs
