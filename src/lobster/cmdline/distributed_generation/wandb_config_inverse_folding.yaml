# WandB Sweep Configuration for Distributed Inverse Folding
# 
# This config distributes inverse folding tasks across multiple jobs.
# Each job processes a subset of input structure files.
#
# Example: 449 structure files with 5 structures per job = 90 jobs
#
# Generate this file using:
#   python src/lobster/cmdline/distributed_generation/create_job_config.py \
#     --mode inverse_folding \
#     --input_structures "/data2/lisanzas/multi_flow_data/test_set_filtered_pt/*.pt" \
#     --structures_per_job 5 \
#     --base_config src/lobster/hydra_config/experiment/generate_inverse_folding_450M.yaml

program: src/lobster/cmdline/distributed_generate.py
method: grid
project: lobster-distributed-inverse-folding
entity: prescient-design
metric:
  name: job_completed
  goal: maximize
parameters:
  base_config_path:
    value: src/lobster/hydra_config/experiment/generate_inverse_folding_450M.yaml
  job_id:
    # Example: 90 jobs for 449 structures with 5 structures per job
    # Adjust this list based on your actual number of jobs
    values:
    - 0
    - 1
    - 2
    - 3
    - 4
    # ... add more job IDs as needed (use create_job_config.py to auto-generate)
  structures_per_job:
    value: 5
  total_structures:
    value: 449  # Update to match your actual number of structure files
  mode:
    value: inverse_folding
command:
- ${env}
- python
- ${program}

