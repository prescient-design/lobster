# @package _global_
# Step X -- velocity + self-cond + Proteina-style distogram aux loss
# + 3Di-token classification aux loss (from-scratch variant).
#
# Same backbone as `flow_nokabsch_velocity_selfcond` plus TWO aux heads:
# a pair head producing (B, L, L, 64) distance-bucket logits, and a
# per-token classifier producing (B, L, 20) 3Di logits. Both heads are
# zero-init at the final layer; the distogram is gated to t > 0.5,
# the 3Di head is ungated. See the model yaml for rationale.
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input_flow_nokabsch_velocity_selfcond_distogram_3di

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow_nokabsch_velocity_selfcond_distogram_3di
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_nokabsch_velocity_selfcond_distogram_3di-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_nokabsch_velocity_selfcond_distogram_3di
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
