# @package _global_
# BASE-size flow-matching 3Di-input experiment (Step G). Same dataset,
# same trainer knobs, same callbacks as the small variants -- only the
# model dims change.

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow_base
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_base-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_base
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  # Keep parity with the small flow runs so per-grad-step token budgets
  # match across S, S+selfcond, and BASE. Worth re-tuning to 8 once the
  # first wandb logs show actual HBM utilisation on B200 for the 98.7M
  # model (likely still <40% util).
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
