# @package _global_
# Step V -- velocity + per-residue 3Di masking (no Kabsch).
# Same Step S recipe (drop Kabsch, keep SO(3) aug, velocity prediction)
# at small (S, ~20.6 M) scale, plus per-residue 3Di token masking on
# conditional samples (mask rate ~ U(0,1) per sample, Bernoulli per
# token). Trains the decoder to handle PARTIAL 3Di conditioning at
# inference (supply tokens for some residues, let the model fill in
# the rest).
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input_flow_nokabsch_velocity_mask3di

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow_nokabsch_velocity_mask3di
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_nokabsch_velocity_mask3di-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_nokabsch_velocity_mask3di
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
