# @package _global_
#
# COMBINED arm: the productive 3Di-distribution stabilized GRPO run
# (rl_leflur_binder_grpo_dist_3di_noptx_stab) PLUS a smooth steric-clash +
# interface-contact geometry reward. Inspecting the top-reward 3di_s750 backbones
# showed a lot of steric CLASHING — the interface-distribution reward matches the
# interface COMPOSITION but is blind to 3-D geometry, so the policy can score well
# while producing overlapping / chain-crossing backbones. The complementary failure
# mode is a binder that avoids clashes by drifting OUT OF CONTACT (floating).
#
# This config adds one smooth, well-behaved [0,1] term (w_clash_contact) that
# penalizes BOTH: steric overlap (clash_score, a soft-core over backbone+Cb atom
# pairs) and absence of interface contact (contact_score, a soft-count of binder
# residues near the antigen). See rewards/_clash_reward.py. Everything else is
# IDENTICAL to rl_leflur_binder_grpo_dist_3di_noptx_stab (Dr.GRPO, spu=3 grad-ckpt,
# iface-collapse penalty -1.0, KL off, lr=1e-5, G=64, Arm-C rollout, 3Di dist
# reward). Reward = w_3di_dist * dist_3di + w_clash_contact * (clash * contact).
#
# Usage (Protenix-free -> N_WORKERS=0 submits the policy job only):
#   OUTBASE=/cv/scratch/u/lisanzas/rl_leflur_binder_grpo_dist_3di_clash_noptx_stab \
#   N_WORKERS=0 \
#   CONFIG=experiment/rl_leflur_binder_grpo_dist_3di_clash_noptx_stab \
#     bash scripts/launch_leflur_grpo.slurm

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.root_dir}/rl_leflur_binder_grpo_dist_3di_clash_noptx_stab"
seed: 12345

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-binder-3di

# Complexa 38-target set (GRPO schema; per-target fixed length) — parsed by _build_targets.
targets: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_grpo_targets.csv"

# Arm C rollout (epitope conditioning ON; fold-diverse 3Di levers — NOT beta-collapsed best-arm).
generation:
  max_length: 512
  use_epitope_conditioning: true
  encode_target_only: false
  cfg_weight: 1.0
  temperature_seq: 1.0
  temperature_struc: 0.31640411575109995
  stochasticity_seq: 1
  stochasticity_struc: 60
  stochasticity_tri: 80
  asynchronous_sampling: false
  inference_schedule_seq: PowerInferenceSchedule
  seq_schedule_exponent: 2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: LogInferenceSchedule
  tri_schedule_exponent: null
  tri_time_accel: 1.0
  sequence_diversity_penalty: 2
  tri_diversity_penalty: 8
  sequence_logit_bias: null
  sequence_logit_bias_steps: 200
  tri_logit_bias: null

grpo:
  group_size: 64
  num_steps: 2000            # large; adjust to compute budget
  rollout_nsteps: 40
  steps_per_update: 3        # 1 -> 3: enabled by grad_checkpoint (frees per-step forward mem).
  grad_checkpoint: true      # checkpoint each per-step forward+logprob -> peak mem ~O(group_size).
  mu: 2
  beta: 0.0                  # KL OFF (deliberately not turned on yet)
  eps_clip: 0.2
  lr: 1.0e-5                 # sole confirmed lever (1e-6 freezes, 1e-4 blows up)
  adv_eps: 1.0e-4
  adv_std_floor: 1.0e-3
  normalize_advantage: false  # Dr.GRPO: mean-center only, no /std (removes std-amplification)
  # Confidence combo OFF -> Protenix skipped entirely (no worker pool, no queue).
  w_iptm: 0.0
  w_ptm: 0.0
  w_abag_iptm: 0.0
  w_plddt: 0.0
  w_gpde: 0.0
  w_pae_global: 0.0
  w_pae_interface: 0.0
  # Structure self-consistency off.
  w_sctm_binder: 0.0
  w_sctm_complex: 0.0
  log_struct_diagnostic: false
  # Within-group Jaccard novelty (AA + 3Di) — off; the dist reward self-regularizes.
  w_seq_diversity: 0.0
  w_struct_diversity: 0.0
  # --- Interface-distribution distance reward (productive lever, kept ON) ---
  w_aa_dist: 0.0             # AA distance OFF for the 3Di-only ablation
  w_3di_dist: 1.0            # 3Di interface-histogram closeness to Complexa reference
  dist_metric: tv           # total variation (D0 primary); "js" also supported
  dist_reference: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/grpo_dist_reference_complexa38.json"
  # Interface-size collapse guardrail: a design whose binder interface has < dist_min_iface
  # residues (min cross-chain Ca-Ca < 8 A) gets its WHOLE dist reward set to the negative
  # penalty, repelling the n_iface-collapse escape hatch instead of softly zeroing it.
  dist_min_iface: 4
  dist_iface_penalty: -1.0
  # --- Smooth clash + interface-contact geometry reward (THIS arm's NEW lever) ---
  # term = w_clash_contact * clash_score * contact_score, both in [0,1] and smooth
  # (tanh soft-core clash + asymmetric raised-cosine band on the binder interface
  # fraction). The band peaks at frac_peak and is 0 outside [frac_lo, frac_hi] --
  # calibrated so native/passing Complexa binders (iface_frac median ~0.16) sit near
  # the peak while diverged GRPO rollouts (iface_frac ~0.47) score 0.
  w_clash_contact: 1.0
  clash_d_clash: 2.2        # soft-core clash center (A): heavy atoms closer overlap
  clash_soft: 0.5           # clash transition width (A)
  clash_scale: 50.0         # E_clash -> clash_score saturation scale
  contact_d0: 8.0           # interface-band center (A), matches the 8 A interface def
  contact_soft: 1.0         # contact transition width (A)
  frac_lo: 0.05             # iface_frac band: contact_score = 0 at/below this
  frac_peak: 0.16           # iface_frac band: peak (contact_score = 1) -- native band
  frac_hi: 0.4              # iface_frac band: contact_score = 0 at/above this
  clash_seq_sep: 2          # exclude binder pairs within this residue separation
  clash_include_cb: true    # include a virtual Cb atom per residue in the clash cloud
  # Both dist (3Di) and clash terms are functions of structure -> only structure/tri
  # tracks get advantage.
  tracks: [structure_tokens, tri_tokens]
  capture_old_lp_inline: true
  grad_clip: 1.0
  seed: 0
  log_every: 1
  ckpt_dir: "${output_dir}/ckpts"
  ckpt_every: 50

reward:
  queue_dir: "${output_dir}/queue"
  targets_csv: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_score_targets.csv"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

wandb:
  enabled: true
  project: leflur-grpo
  name: complexa38-dist3di-clash-noptx-stab-g64
  entity: null
