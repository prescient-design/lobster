# @package _global_
# Single-example overfitting experiment for the PLAIN flow decoder.
#
# Purpose: sanity-check that `Tokenizer3diInputFlow` + `ViTDecoderConditional`
# has the capacity / optimisation behaviour to drive a SINGLE training structure
# to ~0 reconstruction error. If the model cannot overfit one example, no amount
# of data or scale will help -- this isolates an optimisation/wiring bug from the
# (separately-tracked) 3Di conditioning ceiling.
#
# Recipe: same plain-flow model as `train_latent_generator_3di_input_flow.yaml`,
# but:
#   - data is ONE structure (`1ypc_chain_I`, len 64) used for train AND val,
#     batch_size=1, no cluster sampler.
#   - constant LR 1e-4 after a short warmup (the model yaml already ships the
#     constant-with-warmup scheduler; we just shorten the warmup here).
#   - SO(3) augmentation OFF and CFG dropout OFF so the target is a fixed,
#     deterministic structure (otherwise "one example" becomes infinitely many
#     rotations / a conditional+unconditional mixture and won't cleanly overfit).
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input_flow_overfit

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_overfit-${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_overfit
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

data:
  # One structure, reused for all three splits so we train AND validate on it.
  path_to_datasets:
    - /cv/scratch/u/lisanzas/overfit_single_example/data/overfit_train.pt
    - /cv/scratch/u/lisanzas/overfit_single_example/data/overfit_validation.pt
    - /cv/scratch/u/lisanzas/overfit_single_example/data/overfit_test.pt
  # No clustering for a 1-example dataset (the sampler falls back to a single
  # 1-element cluster, i.e. that one structure every step).
  cluster_file: null
  batch_size: 1
  num_workers: 0

model:
  # Deterministic, fixed target so a single example can be memorised exactly.
  random_so3_aug: false
  p_uncond: 0.0
  # Constant 1e-4 (from the model yaml) after a short warmup -- 5000 warmup
  # steps on a single example wastes most of the run ramping the LR.
  num_warmup_steps: 500

callbacks:
  # Dump sampled (Kabsch-aligned) + GT backbone PDBs into a stable viz dir under
  # the repo so they sit next to `overfit_viz/overfit_gt_<name>.pdb`. Files land
  # in `overfit_viz/sample/`. save_every_n=1 -> write on every validation cycle
  # (there is only one val batch). The GT in those files matches the standalone
  # GT written by scripts/_write_overfit_gt_pdb.py.
  flow_backbone_sampling:
    structure_path: /cv/home/lisanzas/lobster/overfit_viz
    sampling_step_counts: [1, 5, 50]
    save_every_n: 1
    max_samples_per_call: 1

trainer:
  num_nodes: 1
  devices: 1
  max_epochs: -1
  # 1 batch == 1 epoch here; cap by steps instead.
  max_steps: 20000
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  precision: bf16-mixed
  # Validate (and run the sampling callback) every 500 steps on the same example.
  val_check_interval: null
  check_val_every_n_epoch: 500
  limit_val_batches: 1
  num_sanity_val_steps: 0
