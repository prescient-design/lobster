# Configuration for unconditional generation with self-reflection - 750M Model - Length 100
# Usage: uv run python -m lobster.cmdline.generate --config-path "../hydra_config/experiment" --config-name generate_unconditional_750M_L100_self_reflection

# Output directory
output_dir: "./examples/generated_unconditional_750M_L100_self_reflection_corrected"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.gen_ume.UMESequenceStructureEncoderLightningModule
  ckpt_path: "/cv/data/ai4dd/data2/ume/gen_ume/runs//2025-11-17T20-31-05/last.ckpt"

# Generation parameters
generation:
  mode: unconditional
  length: [100]
  num_samples: 100
  nsteps: 900
  batch_size: 1
  save_csv_metrics: true
  create_plots: true
  asynchronous_sampling: false
  
  temperature_seq: 0.4548783094535751
  temperature_struc: 0.1878635229597448
  stochasticity_seq: 30
  stochasticity_struc: 80

  inference_schedule_seq: "LogInferenceSchedule"
  inference_schedule_struc: "LinearInferenceSchedule"

  enable_sequence_token_check: true
  sequence_token_check_retries: 100
  
  # Enable self-reflection refinement
  enable_self_reflection: true

  self_reflection:
    use_esmfold_validation: false
    forward_folding:
      nsteps: 100
      temperature_seq: 0.2967457760634187
      temperature_struc: 0.1102551183666233
      stochasticity_seq: 10
      stochasticity_struc: 30
    inverse_folding:
      nsteps: 200
      temperature_seq: 0.16423763902324678
      temperature_struc: 1.0
      stochasticity_seq: 20
      stochasticity_struc: 10
    quality_control:
      enable_tm_threshold: true
      min_tm_score_forward: 0.8334123066155882
      enable_min_percent_identity_threshold: true
      min_percent_identity: 50
      enable_max_percent_identity_threshold: true
      max_percent_identity: 100
      enable_sequence_token_check: true
      max_retries: 100
  
  # Enable ESMFold validation
  use_esmfold: true
  max_length: 512

  # Foldseek Diversity Analysis
  calculate_foldseek_diversity: true
  foldseek_tmscore_threshold: 0.5
  rmsd_threshold_for_diversity: 2.0

  # Resume support
  resume: true
  
  # Not used for unconditional generation
  input_structures: null
