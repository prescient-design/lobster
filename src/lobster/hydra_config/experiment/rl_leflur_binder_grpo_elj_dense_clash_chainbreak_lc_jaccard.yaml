# @package _global_
#
# DENSE arm of the matched dense-vs-sparse e_lj credit-assignment A/B
# (docs/leflur/grpo_two_reward_sets_proposal.tex, fig:sparse-vs-dense). Protenix-free policy.
#
# This arm delivers the interface Lennard-Jones potential (e_lj) as a DENSE per-token structure-
# track advantage: the packed-complex e_lj is decomposed per binder residue, per-position group-
# normalized, and applied to the structure_tokens track (per_token_pot=true, w_pt_lj=1.0). Its twin
# (rl_leflur_binder_grpo_elj_sparse_clash_chainbreak_lc_jaccard) delivers the SAME e_lj as a single
# self-normalized per-design scalar. The two configs are byte-identical except for how e_lj enters
# the advantage, so checkpoints compare step-for-step and the only variable is credit GRANULARITY.
#
# Reward stack (identical across both arms):
#   1. e_lj                 per_token_pot=true, w_pt_lj=1.0 (DENSE here). dsasa/hb density OFF.
#   2. chainbreak           w_chainbreak=1.0, count gate (backbone peptide-bond integrity).
#   3. LC seq               w_seq_complexity=1.0, lc_full=0.7 (within-sequence anti-degeneracy).
#   4. LC 3Di               w_struct_complexity=1.0, struct_lc_full=0.30 (within-3Di anti-degeneracy).
#   5. Jaccard seq          w_seq_diversity=0.1 (within-group between-design AA k-mer novelty).
#   6. Jaccard 3Di          w_struct_diversity=0.1 (within-group between-design 3Di k-mer novelty).
#   7. interface-contact    w_clash_contact=1.0, band(f; 0.05, 0.16, 0.40) + soft clash.
#
# CHORD SFT is HELD OFF (sft_mu=0) so it cannot confound the granularity comparison. All Protenix
# confidence, structure self-consistency, 3Di-TV, 3DZD shape-SC, AAR, and sc-clash are OFF.
#
# WATCH: pot/e_lj_mean should FALL; pot/scored_frac ~1; ptclash/adv_abs_mean populated (per-token
# credit live); chainbreak metrics improve; diversity/lc_mean (seq AND 3Di) HOLD/RISE; reward/
# clash_contact + reward/chainbreak populated; ppo/grad_norm not swamped; struct_ratio_init ~1.0.
#
# Usage (Protenix-free; a SEPARATE a10g repack array serves the e_lj "pot" pool):
#   OUTBASE=/cv/scratch/u/lisanzas/rl_leflur_binder_grpo_elj_dense_clash_chainbreak_lc_jaccard \
#   N_WORKERS=0 M_SHAPE=8 POLICY_HRS=168 \
#   CONFIG=experiment/rl_leflur_binder_grpo_elj_dense_clash_chainbreak_lc_jaccard \
#     bash scripts/launch_leflur_grpo.slurm

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.root_dir}/rl_leflur_binder_grpo_elj_dense_clash_chainbreak_lc_jaccard"
seed: 12345

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-binder-3di

# Complexa 38-target set (GRPO schema; per-target fixed length) — parsed by _build_targets.
targets: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_grpo_targets.csv"

# Arm C rollout (epitope conditioning ON; fold-diverse 3Di levers — NOT beta-collapsed best-arm).
generation:
  max_length: 512
  use_epitope_conditioning: true
  encode_target_only: false
  cfg_weight: 1.0
  temperature_seq: 1.0
  temperature_struc: 0.31640411575109995
  stochasticity_seq: 1
  stochasticity_struc: 60
  stochasticity_tri: 80
  asynchronous_sampling: false
  inference_schedule_seq: PowerInferenceSchedule
  seq_schedule_exponent: 2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: LogInferenceSchedule
  tri_schedule_exponent: null
  tri_time_accel: 1.0
  sequence_diversity_penalty: 2
  tri_diversity_penalty: 8
  sequence_logit_bias: null
  sequence_logit_bias_steps: 200
  tri_logit_bias: null

grpo:
  group_size: 64
  num_steps: 2000            # OPTIMIZER updates; each consumes accum_targets rollouts
  rollout_nsteps: 40
  steps_per_update: 3        # grad_checkpoint keeps peak mem ~O(group_size) per target.
  grad_checkpoint: true      # per-packet forward+backward is sequential -> peak mem ~1 target.
  mu: 2
  beta: 0.0                  # KL OFF (deliberately not turned on yet)
  eps_clip: 0.2
  lr: 1.0e-5                 # sole confirmed lever (1e-6 freezes, 1e-4 blows up)
  adv_eps: 1.0e-4
  adv_std_floor: 1.0e-3
  # --- Multi-target stabilization ---
  accum_targets: 10          # average the gradient over 10 targets per step
  shuffle_targets: true      # reshuffle target order each epoch
  normalize_advantage: true  # per-group /std (== TRL scale_rewards="group")

  # ===================== e_lj — DENSE per-token structure-track advantage =====================
  per_token_pot: true
  w_pt_lj: 1.0
  w_pt_dsasa: 0.0            # dsasa density OFF (area-term reward hacking)
  w_pt_hb: 0.0              # n_hb density OFF (area-term reward hacking)
  pot_with_sasa: false      # skip the slow buried-dSASA compute (unused)
  w_elj_scalar: 0.0         # SPARSE twin OFF (this is the dense arm)
  pt_clash_tracks: [structure_tokens]  # per-token e_lj credit lands on the structure track

  # chainbreak — backbone peptide-bond integrity (scalar, count gate).
  w_chainbreak: 1.0
  chainbreak_gate: count

  # CHORD SFT — HELD OFF (would confound the dense-vs-sparse comparison).
  sft_mu: 0.0
  sft_mu_schedule: null
  sft_use_phi: false
  sft_scope: binder
  sft_label: hard
  sft_temperature: 1.0
  sft_masked_only: true
  sft_reward_gate: null
  struct_sft_mu: 0.0         # Protenix fold-consistency struct-SFT OFF (no Protenix this run)

  # LC (seq) — per-design saturating linguistic-complexity reward (within-sequence anti-degeneracy).
  w_seq_complexity: 1.0
  lc_full: 0.7               # full credit at LC>=0.7, ramp to 0 at collapse
  # LC (3Di) — same, on the 3Di tri-token track (structural alphabet).
  w_struct_complexity: 1.0
  struct_lc_full: 0.30       # saturates at measured Complexa/base 3Di LC (~0.25/0.27); 0.7 was ~2.8x too high

  # within-group Jaccard novelty — between-design anti-consensus guard on BOTH tracks.
  w_seq_diversity: 0.1
  w_struct_diversity: 0.1    # 3Di k-mer Jaccard ON (parent had this at 0.0)

  # interface-contact band — soft clash x soft-count contact band on the decoded backbone.
  w_clash_contact: 1.0
  clash_d_clash: 2.2
  clash_soft: 0.5
  clash_scale: 50.0
  contact_d0: 8.0
  contact_soft: 1.0
  frac_lo: 0.05
  frac_peak: 0.16
  frac_hi: 0.4
  clash_seq_sep: 2
  clash_include_cb: true

  # ===================== EXCLUDED TERMS (all OFF) =====================
  # Protenix confidence combo OFF -> oracle skipped entirely (no worker pool, no queue).
  w_iptm: 0.0
  w_ptm: 0.0
  w_abag_iptm: 0.0
  w_plddt: 0.0
  w_gpde: 0.0
  w_pae_global: 0.0
  w_pae_interface: 0.0
  # Structure self-consistency OFF.
  w_sctm_binder: 0.0
  w_sctm_complex: 0.0
  log_struct_diagnostic: false
  # Interface-distribution (3Di-TV) reward OFF and NOT tracked (won't scale past the ref set).
  w_aa_dist: 0.0
  w_3di_dist: 0.0
  log_dist_diagnostic: false
  # 3DZD shape-SC OFF; AAR scalar OFF (CHORD off, so no designed-seq draw either).
  w_shape: 0.0
  w_aar: 0.0

  # The SEQUENCE track is trainable (kept for parity with the sparse arm; e_lj credit is on
  # structure_tokens via pt_clash_tracks).
  tracks: [structure_tokens, tri_tokens, sequence_tokens]
  capture_old_lp_inline: true
  grad_clip: 1.0
  seed: 0
  log_every: 1
  ckpt_dir: "${output_dir}/ckpts"
  ckpt_every: 25

# ProtenixRewardClient is constructed from this block but is NEVER queried (all conf weights 0,
# no structure/coords), so no Protenix worker pool runs (N_WORKERS=0).
reward:
  queue_dir: "${output_dir}/queue"
  targets_csv: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_score_targets.csv"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

# Full-atom repack reward pool (LigandMPNN-repack workers on a10g GPUs). Serves the e_lj "pot"
# want from one pack per design. With CHORD off, per_token_pot is what turns this pool on.
shape:
  queue_dir: "${output_dir}/shape_queue"
  # 600s (not 1800) so a starved/idle-died repack pool floors its group within ~10 min and the rank
  # reaches the grad all-reduce well before the NCCL watchdog (3600s) trips -> no 8-way deadlock.
  # Healthy 64-design group collect is ~15-30s, so this is a >=20x margin over the healthy case.
  timeout_s: 600
  poll_s: 2.0
  cache: true
  n_shards: 8

wandb:
  enabled: true
  project: leflur-grpo
  name: complexa38-elj-dense-clash-chainbreak-lc-jaccard-g64
