# @package _global_
# Step U -- velocity + self-conditioning (no Kabsch).
# Tests whether self-cond pays rent on top of the velocity baseline that
# Step T showed actually USES multi-step ODE integration. The data-pred +
# Kabsch baseline saw `flow_selfcond ~= flow` at convergence (Step N) -- but
# under that regime multi-step trajectories drift away from GT (exposure
# bias), so feeding the previous step's prediction as self-cond input
# couldn't help. With multi-step ODE now actually contributing, the
# self-cond hypothesis gets a fair test.
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input_flow_nokabsch_velocity_selfcond

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow_nokabsch_velocity_selfcond
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_nokabsch_velocity_selfcond-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_nokabsch_velocity_selfcond
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
