# @package _global_

# Variability experiment for worst prediction: 7zgi.B
# This structure had the highest RMSD (73.71 Å) and lowest TM-score (0.1202) in CAMEO 2022
# Running 20 trials to assess prediction variability and stochasticity
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_forward_folding_450M_7zgi_B_variability

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "./examples/variability_experiment_7zgi_B"

# Random seed for reproducibility
seed: 54321

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.research_2025_11_07}" 

# Generation settings
generation:
  mode: forward_folding
  nsteps: 500              # Same as original experiment
  batch_size: 1            # Process one structure at a time
  n_trials: 20             # Run 20 trials to test variability
  
  # Generation parameters (same as original)
  temperature_seq: 0.3610371899835548
  temperature_struc: 0.2195534567490864
  stochasticity_seq: 1
  stochasticity_struc: 20
  
  # Input structure - worst prediction from CAMEO 2022 forward folding
  # PDB: 7zgi chain B (316 amino acids)
  # Original results: TM-score=0.1202, RMSD=73.71 Å
  input_structures: "${paths.benchmarks.cameo}/7zgi.B.pt"
  
  # Maximum length for structures
  max_length: 512
  
  # Not used for forward folding
  length: null
  num_samples: null

