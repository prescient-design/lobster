# @package _global_

# Example configuration for binder design
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_binder_design

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "./examples/binder_design_output"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "s3://prescient-lobster/ume/gen_ume/checkpoints/gen-ume-small-PDB-90M.ckpt"

# Generation settings
generation:
  mode: binder_design

  # Target structure (PDB file with one or more chains)
  # Update this path to your target PDB file
  input_structures: "${paths.examples.binder_template}"

  # Target chain to design binder against (use chain letter from PDB)
  # This is the chain the binder will bind to
  target_chain: "A"

  # Binder length (number of residues to generate)
  # Typical range: 50-150 residues
  binder_length: 50

  # Optional: Epitope residue indices (in coords_res numbering, 0-indexed)
  # If specified, binder atoms are randomly distributed:
  #   - Ball center: 5Å from epitope center (away from target COM)
  #   - Ball radius: 12Å
  #   - Constraint: All atoms ≥5Å from target (rejection sampling)
  # If not specified (null), random distribution around target's center of mass
  # Example: [10, 11, 12, 13, 14] for residues 10-14
  epitope_indices: [155]

  # Generation parameters
  nsteps: 400              # Number of generation steps
  n_trials: 1              # Number of trials per design (best selected by metrics)
  n_designs_per_structure: 10  # Number of independent designs to generate

  # Sampling parameters - control diversity and quality
  temperature_seq: 0.27315634404739075 
  temperature_struc: 0.31640411575109995 
  stochasticity_seq: 20 
  stochasticity_struc: 60
  asynchronous_sampling: false          # Use synchronous sampling

  # ESMFold validation (highly recommended for binder design)
  use_esmfold: true
  max_length: 512

  # Optional: Specify chain groups for ESMFold validation
  # If not specified, will automatically validate target+binder together
  # Examples:
  #   - null: Validate target+binder complex (default, recommended)
  #   - [[0, 200]]: Explicitly validate chain 0 (target) and 200 (binder) together
  esmfold_chain_groups: null

  # CSV metrics and plotting
  save_csv_metrics: true
  create_plots: true

