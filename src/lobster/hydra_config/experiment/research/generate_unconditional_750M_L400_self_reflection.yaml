# @package _global_

# Configuration for unconditional generation with self-reflection - 750M Model - Length 400
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_unconditional_750M_L400_self_reflection

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "./examples/generated_unconditional_750M_L400_self_reflection"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.research_2025_11_17}"

# Generation parameters
generation:
  mode: unconditional
  length: [400]
  num_samples: 100
  nsteps: 700
  batch_size: 1
  save_csv_metrics: true
  create_plots: true
  asynchronous_sampling: false
  
  temperature_seq: 0.15130433915934352
  temperature_struc: 0.20494831756426257
  stochasticity_seq: 10
  stochasticity_struc: 70

  inference_schedule_seq: "LogInferenceSchedule"
  inference_schedule_struc: "LinearInferenceSchedule"

  enable_sequence_token_check: true
  sequence_token_check_retries: 100
  
  # Enable self-reflection refinement
  enable_self_reflection: true

  self_reflection:
    use_esmfold_validation: false
    forward_folding:
      nsteps: 100
      temperature_seq: 0.2967457760634187
      temperature_struc: 0.1102551183666233
      stochasticity_seq: 10
      stochasticity_struc: 30
    inverse_folding:
      nsteps: 200
      temperature_seq: 0.16423763902324678
      temperature_struc: 1.0
      stochasticity_seq: 20
      stochasticity_struc: 10
    quality_control:
      enable_tm_threshold: true
      min_tm_score_forward: 0.8334123066155882
      enable_min_percent_identity_threshold: true
      min_percent_identity: 50
      enable_max_percent_identity_threshold: true
      max_percent_identity: 100
      enable_sequence_token_check: true
      max_retries: 100
  
  # Enable ESMFold validation
  use_esmfold: true
  max_length: 512

  # Foldseek Diversity Analysis
  calculate_foldseek_diversity: true
  foldseek_tmscore_threshold: 0.5
  rmsd_threshold_for_diversity: 2.0

  # Sequence anchors to prevent low-complexity collapse
  sequence_anchor_fraction: 0.1

  # Resume support
  resume: true
  
  # Not used for unconditional generation
  input_structures: null
