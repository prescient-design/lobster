# @package _global_

# Forward folding evaluation on RGN2 dataset (orphan + denovo chains)
# Uses the best checkpoint from the gen_ume_denovo training run
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_forward_folding_denovo_rgn2

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/gen_ume_denovo_rgn2_forward_folding"

seed: 54321

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.ted}"

generation:
  mode: forward_folding
  nsteps: 200
  batch_size: 1
  n_trials: 1
  
  # Generation parameters
  temperature_seq: 0.3610371899835548
  temperature_struc: 0.2195534567490864
  stochasticity_seq: 1
  stochasticity_struc: 20
  
  # Input structures - RGN2 orphan + denovo (combined; use *_denovo or *_orphan configs for separate)
  input_structures:
    - "${paths.benchmarks.rgn2_denovo}/*.pt"
    - "${paths.benchmarks.rgn2_orphan}/*.pt"
  
  max_length: 512
  length: null
  num_samples: null
