# @package _global_

# Configuration for unconditional generation - 750M Model - Length 100
# Hyperparameters to be populated from wandb sweep results
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_unconditional_750M_L100

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "./examples/generated_unconditional_750M_L100"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.research_2025_11_17}"

# Generation parameters
generation:
  mode: unconditional
  length: [100]
  num_samples: 100
  nsteps: 800  # TODO: populate from sweep
  batch_size: 1
  save_csv_metrics: true
  create_plots: true
  asynchronous_sampling: false
  
  # Unconditional generation parameters - TODO: populate from sweep
  temperature_seq: 0.22025811261469913  # TODO: populate from sweep
  temperature_struc: 0.5335621264325812  # TODO: populate from sweep
  stochasticity_seq: 70  # TODO: populate from sweep
  stochasticity_struc: 20  # TODO: populate from sweep

  inference_schedule_seq: "LogInferenceSchedule"  # TODO: populate from sweep
  inference_schedule_struc: "LinearInferenceSchedule"  # TODO: populate from sweep

  enable_sequence_token_check: true
  sequence_token_check_retries: 100
  
  # Enable self-reflection refinement (improves ESMFold metrics)
  enable_self_reflection: false
  
  # Enable ESMFold validation (required to measure improvement)
  use_esmfold: true
  max_length: 512

  # Foldseek Diversity Analysis (structural clustering)
  calculate_foldseek_diversity: true
  foldseek_bin_path: "${paths.binaries.foldseek_bin}"
  foldseek_tmscore_threshold: 0.5
  rmsd_threshold_for_diversity: 2.0
  
  # Not used for unconditional generation
  input_structures: null


