# @package _global_

# Inverse folding evaluation on CAMEO dataset
# Uses the best checkpoint from the gen_ume_denovo training run
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_inverse_folding_denovo_cameo

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/gen_ume_denovo_cameo_inverse_folding"

seed: 54321

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.ted}"

generation:
  mode: inverse_folding
  nsteps: 100
  batch_size: 1
  n_trials: 1
  
  # Generation parameters
  temperature_seq: 0.14995423473740457
  temperature_struc: 0.4178150796307539
  stochasticity_seq: 10
  stochasticity_struc: 50

  enable_sequence_token_check: true
  sequence_token_check_retries: 100

  n_designs_per_structure: 1
  
  # Input structures - CAMEO valid processed set
  input_structures: "${paths.benchmarks.cameo}/*.pt"

  # Enable ESMFold validation
  use_esmfold: true
  max_length: 512
  
  # Not used for inverse folding
  length: null
  num_samples: null
