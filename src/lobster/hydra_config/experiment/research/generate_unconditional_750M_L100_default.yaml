# @package _global_

# Unconditional generation with default (sweep-tuned) settings - 750M Model - Length 100 - No self-reflection
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_unconditional_750M_L100_default

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "./examples/generated_unconditional_750M_L100_default"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.research_2025_11_17}"

# Generation parameters
generation:
  mode: unconditional
  length: [100]
  num_samples: 100
  nsteps: 900
  batch_size: 1
  save_csv_metrics: true
  create_plots: true
  asynchronous_sampling: false

  temperature_seq: 0.4548783094535751
  temperature_struc: 0.1878635229597448
  stochasticity_seq: 30
  stochasticity_struc: 80

  inference_schedule_seq: "LogInferenceSchedule"
  inference_schedule_struc: "LinearInferenceSchedule"

  enable_sequence_token_check: true
  sequence_token_check_retries: 100

  enable_self_reflection: false

  # ESMFold validation
  use_esmfold: true
  max_length: 512

  # Foldseek Diversity Analysis
  calculate_foldseek_diversity: true
  foldseek_tmscore_threshold: 0.5
  rmsd_threshold_for_diversity: 2.0

  # Resume support
  resume: true

  input_structures: null
