# @package _global_

# Test: Unconditional generation with sequence anchors + self-reflection at length 400
# Purpose: Test anchors (10%) + self-reflection pipeline together
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_unconditional_450M_anchor_test_L400

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "./examples/generated_unconditional_450M_anchor_sr_test_L400"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.research_2025_11_07}"

# Generation parameters
generation:
  mode: unconditional
  length: [400]
  num_samples: 10
  nsteps: 400
  batch_size: 1
  save_csv_metrics: true
  create_plots: false
  asynchronous_sampling: false
  
  # Same generation parameters as the self-reflection config
  temperature_seq: 0.27315634404739075 
  temperature_struc: 0.31640411575109995 
  stochasticity_seq: 20 
  stochasticity_struc: 60

  inference_schedule_seq: "LogInferenceSchedule"
  inference_schedule_struc: "PowerInferenceSchedule"

  enable_sequence_token_check: true
  sequence_token_check_retries: 10

  # Sequence anchors: fix 10% of positions to random amino acids to prevent collapse
  sequence_anchor_fraction: 0.1

  # Enable self-reflection refinement
  enable_self_reflection: true

  self_reflection:
    use_esmfold_validation: false
    forward_folding:
      nsteps: 100
      temperature_seq: 0.2967457760634187
      temperature_struc: 0.1102551183666233
      stochasticity_seq: 10
      stochasticity_struc: 30
    inverse_folding:
      nsteps: 200
      temperature_seq: 0.16423763902324678
      temperature_struc: 1.0
      stochasticity_seq: 20
      stochasticity_struc: 10
    quality_control:
      enable_tm_threshold: true
      min_tm_score_forward: 0.8334123066155882
      enable_min_percent_identity_threshold: true
      min_percent_identity: 50
      enable_max_percent_identity_threshold: true
      max_percent_identity: 100
      enable_sequence_token_check: true
      max_retries: 10
  
  # Enable ESMFold validation
  use_esmfold: true
  max_length: 512

  # Skip diversity for quick test
  calculate_foldseek_diversity: false
  
  # Not used for unconditional generation
  input_structures: null
