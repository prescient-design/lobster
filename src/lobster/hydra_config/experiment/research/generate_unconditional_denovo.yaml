# @package _global_

# Unconditional generation evaluation for gen_ume_denovo
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/research/generate_unconditional_denovo

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/gen_ume_denovo_unconditional"

# Random seed for reproducibility
seed: 12345

# Model configuration
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: "${paths.checkpoints.ted}"

# Generation parameters
generation:
  mode: unconditional
  length: [100, 200, 300, 400, 500]
  num_samples: 100
  nsteps: 400
  batch_size: 1
  save_csv_metrics: true
  create_plots: true
  asynchronous_sampling: false
  
  # Unconditional generation parameters
  temperature_seq: 0.27315634404739075 
  temperature_struc: 0.31640411575109995 
  stochasticity_seq: 20 
  stochasticity_struc: 60

  inference_schedule_seq: "LogInferenceSchedule"
  inference_schedule_struc: "PowerInferenceSchedule"

  # Per-amino-acid logit bias (additive, applied before temperature scaling)
  # Keys are one-letter AA codes, values are bias magnitudes
  # Example: {V: 2.0, I: 1.5, T: 1.0, Y: 1.0, F: 1.0, W: 1.0}
  sequence_logit_bias: null
  # Number of initial denoising steps to apply the logit bias (0 = no bias)
  sequence_logit_bias_steps: 10

  enable_sequence_token_check: true
  sequence_token_check_retries: 100
  
  # Enable self-reflection refinement
  enable_self_reflection: false
  
  # Enable ESMFold validation
  use_esmfold: true
  max_length: 512

  # Foldseek Diversity Analysis (structural clustering)
  calculate_foldseek_diversity: true
  foldseek_bin_path: "${paths.binaries.foldseek_bin}"
  foldseek_tmscore_threshold: 0.5
  rmsd_threshold_for_diversity: 2.0
  
  # Not used for unconditional generation
  input_structures: null
