# @package _global_
#
# TEN-TERM GRPO binder reward set = the NINE-TERM sparse-e_lj + Rg + sol/elec arm PLUS the BindCraft
# AF2-multimer **interface-PAE** fold reward, in its **Z-SCORED (scalar)** formulation. This is the
# scalar twin of rl_leflur_binder_grpo_..._solelec_bindcraftpae.yaml (the FLAT arm): identical GRPO
# knobs, identical warm-start, identical nine inherited terms, identical BindCraft AF2 fold pool — the
# ONLY difference is HOW pae_interface enters the advantage (z-scored add-on vs flat confidence term).
# It is the docking-AWARE sibling of the ESMFold sc-TM z-score arm: where ESMFold folds the binder
# MONOMER in isolation (docking-BLIND, gated NEGATIVE twice — esmfold-selfconsist-gate-negative),
# BindCraft folds the COMPLEX (binder seq vs the antigen template) and scores the mean cross-chain
# interface PAE — the field-standard in-silico binder discriminator (BindCraft / RFdiffusion filter).
#
# ***THIS REWARD CLEARED THE OFFLINE GATE*** (the first fold reward to do so). Phase-1b benchmark
# 09-04 (job 20837955, 350 folds on the Complexa gate pool): pae_interface AUROC 0.806 (1 recycle) /
# 0.836 (3 recycles), both above e_lj 0.720 and above dsasa 0.757 / n_hb 0.742; AF2-iptm corroborates
# (0.800/0.833). PASS designs fold to a tighter interface (pae 0.62) than FAIL (0.85). Recycle choice =
# 3 (+4 s/fold buys +0.03 AUROC). Full record: docs/leflur/bindcraft_pae_interaction_reward_plan.md,
# memory bindcraft-af2-pae-install.
#
# HOW pae_interface ENTERS THE REWARD — Z-SCORED (this arm), contrast the FLAT arm:
#   w_pae_interface_scalar is a SCALAR (z-score) weight, NOT a confidence weight. It still fires the
#   SAME BindCraft AF2 fold (need_conf now also flips on when w_pae_interface_scalar > 0, so one fold
#   job per rollout group still goes to reward.queue_dir), but instead of folding the oriented pae into
#   the confidence term that is standardized JOINTLY with the whole base reward, the trainer extracts
#   each design's oriented pae ( _clip01(1 - pae_interface/32), via confidence_components — byte-faithful
#   to the flat orientation), z-scores it WITHIN the group, and ADDS it DIRECTLY to the design-level
#   advantage (guaranteed unit variance = equal influence with the z-scored e_lj / sol+elec add-ons),
#   exactly as w_sctm_esmfold_scalar / w_elj_scalar / w_solelec_scalar do. pae_interface is
#   POSITIVE-oriented (higher oriented = lower PAE = better) so it is NOT negated before z-scoring
#   (contrast the e_lj / sol+elec penalty terms). w_pae_interface is held at 0 so the term rides ONLY
#   the z-score path, not the flat confidence sum.
#
#   WHY z-score rather than flat: the flat conf term shares the base reward's joint group z-score, where
#   the raw oriented-pae spread competes on the same footing as every other flat term BEFORE
#   standardization; the z-scored e_lj / sol+elec add-ons that follow the base standardization carry
#   guaranteed unit variance and can dominate. The z-score twin puts pae on that SAME unit-variance
#   footing (equal influence by construction), the same argument that motivated the esmfold sc-TM
#   z-score twin. This arm A/Bs flat vs z-scored pae directly (identical warm-start & every other term).
#
#   WARM-START (NOT a cold leflur-binder-3di start): resumes from grpo_step_525 of the sol+elec arm
#   (rl_leflur_binder_grpo_elj_sparse_clash_chainbreak_lc_jaccard_rog_solelec) — the byte-identical
#   nine-term base and the SAME warm-start point as the FLAT bindcraftpae arm and the esmfold-sctm-zscore
#   twin, so all fold-reward arms are directly comparable (identical starting policy; only the fold
#   reward and its flat-vs-zscore wiring differ). The bare GRPO {state_dict, grpo_step} ckpt is
#   materialized into a Lightning envelope first (scripts/_materialize_grpo_ckpt.py) ->
#   grpo_step_525_lightning.ckpt in model.ckpt_path below. To start cold instead, set ckpt_path to the
#   base leflur-binder-3di snapshot.
#
#   DEGENERACY GUARD (tracked): a single-AA-collapsed binder can fold to a confident interface without
#   being a real binder (degenerate-sequences-mark-failure). The incumbent LC (seq+3Di) + Jaccard terms
#   fight degeneracy; the conf logging (conf/pae_interface_mean, pae_scalar/oriented_pae_mean...) shows
#   the fold signal and the z-scored add-on magnitude (pae_scalar/adv_abs_mean).
#
# The nine inherited terms are BYTE-IDENTICAL to the sol+elec arm, the FLAT bindcraftpae arm, and the
# esmfold arms:
#   1. e_lj (PRIMARY)   w_elj_scalar=1.0 (SPARSE; per_token_pot OFF). dsasa/hb OFF.
#   2. chainbreak       w_chainbreak=1.0, count gate (backbone peptide-bond integrity).
#   3. LC seq           w_seq_complexity=1.0, lc_full=0.7 (within-sequence anti-degeneracy).
#   4. LC 3Di           w_struct_complexity=1.0, struct_lc_full=0.30 (within-3Di anti-degeneracy).
#   5. Jaccard seq      w_seq_diversity=0.1 (within-group between-design AA k-mer novelty).
#   6. Jaccard 3Di      w_struct_diversity=0.1 (within-group between-design 3Di k-mer novelty).
#   7. interface-contact w_clash_contact=1.0, band(f; 0.05, 0.16, 0.40) + soft clash.
#   8. Rg compactness   w_rog=1.0, rog_r0=2.2, rog_full=0.76.
#   9. sol+elec         w_solelec_scalar=1.0 (REF2015 fa_sol+fa_elec / iface res, single group z-score).
#  10. BindCraft PAE    w_pae_interface_scalar=1.0 (docking-aware AF2 interface-PAE, Z-SCORED; THIS arm's
#      added term). w_pae_interface=0 (flat form OFF).
#
# CHORD SFT is HELD OFF (sft_mu=0). Protenix confidence combo, Protenix structure self-consistency,
# ESMFold sc-TM, 3Di-TV, 3DZD shape-SC, and AAR are all OFF.
#
# POOLS (this arm needs BOTH):
#   - FOLD pool (reward.queue_dir): the BindCraft AF2 worker array, serving the pae_interface fold
#     (FOLD_BACKEND=bindcraft, N_WORKERS>0). ~44 s/fold @ 3 recycles on a10g. Keep N_WORKERS >= reward.
#     n_shards so a whole group's designs fan across the pool inside reward.timeout_s.
#   - SHAPE pool (shape.queue_dir): the LigandMPNN-repack array serving the e_lj + sol+elec "pot" want
#     (M_SHAPE>0). No esmfold want this arm. Keep M_SHAPE high (24-32).
#
# WATCH: conf/pae_interface_mean should FALL (lower PAE = tighter interface = better) and
# pae_scalar/oriented_pae_mean RISE, WITHOUT diversity/lc (seq+3Di) collapsing or binder degeneracy
# rising (pae hacked via a generic compact fold); rog HOLD/RISE; chainbreak HOLD; solelec + e_lj
# HOLD/FALL; ppo/grad_norm not swamped.
# Open question: pass% at a /leflur-table6-eval checkpoint vs the sol+elec s525 warm-start baseline, vs
# the FLAT bindcraftpae arm (does z-scoring pae beat the flat conf term?), AND vs the esmfold-sctm-zscore
# twin (does docking-AWARE folding beat docking-BLIND in the loop?).
#
# Usage (BindCraft fold pool + a SEPARATE repack pool for e_lj/sol+elec):
#   OUTBASE=/cv/scratch/u/lisanzas/rl_leflur_binder_grpo_elj_sparse_clash_chainbreak_lc_jaccard_rog_solelec_bindcraftpae_zscore \
#   FOLD_BACKEND=bindcraft N_WORKERS=8 M_SHAPE=24 POLICY_HRS=168 \
#   CONFIG=experiment/rl_leflur_binder_grpo_elj_sparse_clash_chainbreak_lc_jaccard_rog_solelec_bindcraftpae_zscore \
#     bash scripts/launch_leflur_grpo.slurm

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.root_dir}/rl_leflur_binder_grpo_elj_sparse_clash_chainbreak_lc_jaccard_rog_solelec_bindcraftpae_zscore"
seed: 12345

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  # WARM-START from the sol+elec arm's grpo_step_525 (materialized into a Lightning envelope via
  # scripts/_materialize_grpo_ckpt.py) — the SAME point as the FLAT bindcraftpae arm and the
  # esmfold-sctm-zscore twin, so all fold-reward arms share an identical starting policy. NOT a cold
  # leflur-binder-3di start.
  ckpt_path: /cv/scratch/u/lisanzas/rl_leflur_binder_grpo_elj_sparse_clash_chainbreak_lc_jaccard_rog_solelec/ckpts/grpo_step_525_lightning.ckpt

# Complexa 38-target set (GRPO schema; per-target fixed length) — parsed by _build_targets.
targets: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_grpo_targets.csv"

# Arm C rollout (epitope conditioning ON; fold-diverse 3Di levers — NOT beta-collapsed best-arm).
generation:
  max_length: 512
  use_epitope_conditioning: true
  encode_target_only: false
  cfg_weight: 1.0
  temperature_seq: 1.0
  temperature_struc: 0.31640411575109995
  stochasticity_seq: 1
  stochasticity_struc: 60
  stochasticity_tri: 80
  asynchronous_sampling: false
  inference_schedule_seq: PowerInferenceSchedule
  seq_schedule_exponent: 2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: LogInferenceSchedule
  tri_schedule_exponent: null
  tri_time_accel: 1.0
  sequence_diversity_penalty: 2
  tri_diversity_penalty: 8
  sequence_logit_bias: null
  sequence_logit_bias_steps: 200
  tri_logit_bias: null

grpo:
  group_size: 64
  num_steps: 2000            # OPTIMIZER updates; each consumes accum_targets rollouts
  rollout_nsteps: 40
  steps_per_update: 3        # grad_checkpoint keeps peak mem ~O(group_size) per target.
  grad_checkpoint: true      # per-packet forward+backward is sequential -> peak mem ~1 target.
  mu: 2
  beta: 0.0                  # KL OFF (deliberately not turned on yet)
  eps_clip: 0.2
  lr: 1.0e-5                 # sole confirmed lever (1e-6 freezes, 1e-4 blows up)
  adv_eps: 1.0e-4
  adv_std_floor: 1.0e-3
  # --- Multi-target stabilization ---
  accum_targets: 10          # average the gradient over 10 targets per step
  shuffle_targets: true      # reshuffle target order each epoch
  normalize_advantage: true  # per-group /std (== TRL scale_rewards="group")

  # ===================== e_lj — SPARSE self-normalized per-design advantage =====================
  per_token_pot: false       # dense per-token e_lj OFF (this is the sparse arm)
  w_pt_lj: 0.0
  w_pt_dsasa: 0.0
  w_pt_hb: 0.0
  pot_with_sasa: false       # repack still returns e_lj/fa_sol/e_elec (via the "pot" want)
  w_elj_scalar: 1.0          # per-design total-e_lj z-score added to the group advantage

  # (2) chainbreak — backbone peptide-bond integrity (scalar, count gate).
  w_chainbreak: 1.0
  chainbreak_gate: count

  # CHORD SFT — HELD OFF (would confound the added-term comparison).
  sft_mu: 0.0
  sft_mu_schedule: null
  sft_use_phi: false
  sft_scope: binder
  sft_label: hard
  sft_temperature: 1.0
  sft_masked_only: true
  sft_reward_gate: null
  struct_sft_mu: 0.0         # Protenix fold-consistency struct-SFT OFF (this run's fold is BindCraft AF2)

  # (3) LC (seq) — per-design saturating linguistic-complexity reward (within-sequence anti-degeneracy).
  w_seq_complexity: 1.0
  lc_full: 0.7               # full credit at LC>=0.7, ramp to 0 at collapse
  # (4) LC (3Di) — same, on the 3Di tri-token track (structural alphabet).
  w_struct_complexity: 1.0
  struct_lc_full: 0.30       # saturates at measured Complexa/base 3Di LC (~0.25/0.27)

  # (5,6) within-group Jaccard novelty — between-design anti-consensus guard on BOTH tracks.
  w_seq_diversity: 0.1
  w_struct_diversity: 0.1    # 3Di k-mer Jaccard ON

  # (7) interface-contact band — soft clash x soft-count contact band on the decoded backbone.
  w_clash_contact: 1.0
  clash_d_clash: 2.2
  clash_soft: 0.5
  clash_scale: 50.0
  contact_d0: 8.0
  contact_soft: 1.0
  frac_lo: 0.05
  frac_peak: 0.16
  frac_hi: 0.4
  clash_seq_sep: 2
  clash_include_cb: true

  # (8) Rg compactness — per-design saturating global-fold-state reward on binder Rg.
  w_rog: 1.0
  rog_r0: 2.2                # Rg_compact = rog_r0 * N^(1/3)
  rog_full: 0.76            # full credit once compactness >= 0.76 (passing-Complexa fold state)

  # (9) sol+elec — per-design COMBINED REF2015 fa_sol + fa_elec interface complementarity energy
  #     / interface residue, combined IN PHYSICAL UNITS (w_sol=1.0, w_elec=1.0) then a SINGLE group
  #     z-score into the design advantage. Reuses the same repack pack as e_lj. Physical sub-weights.
  w_solelec_scalar: 1.0
  w_solelec_wsol: 1.0        # REF2015 fa_sol weight
  w_solelec_welec: 1.0       # REF2015 fa_elec weight
  # The two SEPARATE chemistry arms are OFF — the combined arm above replaces them.
  w_fasol_scalar: 0.0
  w_elec_scalar: 0.0

  # ESMFold sc-TM OFF — this arm's fold reward is the docking-AWARE BindCraft PAE below, not the
  # docking-blind ESMFold binder monomer sc-TM.
  w_sctm_esmfold: 0.0
  w_sctm_esmfold_scalar: 0.0

  # ===================== (10) BindCraft AF2 interface-PAE — Z-SCORED added fold reward =====================
  # w_pae_interface_scalar > 0 flips need_conf on: the policy submits one fold job per rollout group to
  # reward.queue_dir, the BindCraft AF2 worker (FOLD_BACKEND=bindcraft) folds each binder seq vs the
  # antigen template and returns pae_interface (Angstroms, i_pae*31); the trainer orients it
  # ( _clip01(1 - pae_interface/32) via confidence_components), z-scores it within the group, and ADDS
  # it DIRECTLY to the design-level advantage (unit variance = equal influence). POSITIVE-oriented ->
  # NOT negated. The FLAT confidence form is OFF (w_pae_interface=0) so pae rides ONLY the z-score path.
  # All OTHER conf weights stay 0 so pae_interface is the sole fold signal.
  w_pae_interface: 0.0       # FLAT conf form OFF (contrast the flat bindcraftpae arm's 1.0)
  w_pae_interface_scalar: 1.0  # Z-SCORED per-design pae add-on into the group advantage (THIS arm)
  w_iptm: 0.0
  w_ptm: 0.0                 # NB dataclass default is 0.5 — pinned to 0 so only pae_interface drives conf
  w_abag_iptm: 0.0
  w_plddt: 0.0
  w_gpde: 0.0
  w_pae_global: 0.0

  # ===================== EXCLUDED TERMS (all OFF) =====================
  # Protenix structure self-consistency OFF (no Protenix this run; the fold backend is BindCraft AF2).
  w_sctm_binder: 0.0
  w_sctm_complex: 0.0
  log_struct_diagnostic: false
  # Interface-distribution (3Di-TV) reward OFF and NOT tracked (won't scale past the ref set).
  w_aa_dist: 0.0
  w_3di_dist: 0.0
  log_dist_diagnostic: false
  # 3DZD shape-SC OFF; AAR scalar OFF (CHORD off, so no designed-seq draw either).
  w_shape: 0.0
  w_aar: 0.0

  # All three tracks trainable; the sparse e_lj advantage broadcasts to every track (design PPO).
  tracks: [structure_tokens, tri_tokens, sequence_tokens]
  capture_old_lp_inline: true
  grad_clip: 1.0
  seed: 0
  log_every: 1
  ckpt_dir: "${output_dir}/ckpts"
  ckpt_every: 25

# ProtenixRewardClient (metric-agnostic queue client) — ACTIVE this run: w_pae_interface_scalar>0 means
# the policy submits fold jobs here and blocks for pae_interface. The BindCraft AF2 worker array drains
# this queue (FOLD_BACKEND=bindcraft) instead of Protenix; the client/trainer are unchanged.
reward:
  queue_dir: "${output_dir}/queue"
  targets_csv: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_score_targets.csv"
  # 1800s is comfortable for BindCraft folds (~44 s/design @ 3 recycles; a full n_shards=8 shard of ~8
  # designs ~= 350 s). Raise reward.n_shards toward N_WORKERS to fan a group wider on a large pool.
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

# Full-atom repack reward pool (LigandMPNN-repack workers on a10g GPUs). Serves the e_lj + fa_sol +
# e_elec "pot" want from one pack per design. w_elj_scalar / w_solelec_scalar turn this pool on. No
# esmfold want this arm (w_sctm_esmfold_scalar=0).
shape:
  queue_dir: "${output_dir}/shape_queue"
  # 600s (not 1800) so a starved/idle-died repack pool floors its group within ~10 min and the rank
  # reaches the grad all-reduce well before the NCCL watchdog (3600s) trips -> no 8-way deadlock.
  timeout_s: 600
  poll_s: 2.0
  cache: true
  n_shards: 8

wandb:
  enabled: true
  project: leflur-grpo
  name: complexa38-elj-sparse-clash-chainbreak-lc-jaccard-rog-solelec-bindcraftpae-zscore-g64
