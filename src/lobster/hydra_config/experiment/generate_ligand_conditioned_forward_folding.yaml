# @package _global_

# Protein-ligand forward folding: given a protein sequence + ligand context,
# fold the protein structure (decoded + ESMFold) and score the result.
#
# Usage:
#   uv run python -m lobster.cmdline.generate \
#     --config-name experiment/generate_ligand_conditioned_forward_folding \
#     generation.data_dir=/path/to/posebusters_benchmark_no_overlap

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/ligand_cond_forward_folding"

seed: 54321

model:
  _target_: lobster.model.leflur.LeFlurProteinLigandLightningModule
  ckpt_path: leflur-pl

generation:
  mode: protein_ligand_forward_folding

  # Sampling
  nsteps: 200
  batch_size: 1
  max_length: 512
  max_protein_length: 512
  num_samples: 100   # null -> full benchmark

  # Generation hyperparameters (mirror the conference benchmark sweep)
  temperature_seq: 0.5
  temperature_struc: 0.5
  stochasticity_seq: 20
  stochasticity_struc: 20
  temperature_ligand: 0.5
  stochasticity_ligand: 20

  # Schedules per modality
  inference_schedule_seq: LinearInferenceSchedule
  inference_schedule_struc: PowerInferenceSchedule
  inference_schedule_ligand_atom: null  # fall back to schedule_seq
  inference_schedule_ligand_struc: null # fall back to schedule_struc

  # Context + pocket
  ligand_context_mode: "atom_bond_only"
  pocket_distance_threshold: 5.0

  # Outputs
  save_structures: false
  save_gt_structure: false

  # Best-of-N
  num_predictions: 1
  best_of_n_metric: "plddt"
  save_all_predictions: false

  # Mirror image handling
  try_reflection: false

  # Optional ligand minimization
  minimize_ligand: false
  minimize_mode: bonds_and_angles
  force_field: MMFF94
  minimize_steps: 500

  # Co-folding validators
  use_protenix: false
  use_boltz: false
  raw_data_dir: null

  # Data
  data_dir: "${paths.benchmarks.posebusters_benchmark_no_overlap}"
  input_structures: null
  use_esmfold: true
