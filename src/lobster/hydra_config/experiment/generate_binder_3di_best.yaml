# @package _global_

# Alternate 3Di binder-design config — the "best" schedule arm from the Complexa
# 38-target sweep. Same checkpoint as `generate_binder_3di`, but the sampler
# schedules are flipped and sequence remasking stochasticity is raised.
#
# On the Complexa 38-target benchmark (100 designs/target) this arm reaches the
# highest pass rate we measured: 7.18% at 36/38 coverage, vs 6.05% (36/38) for
# the default a8 arm in `generate_binder_3di`. Both configs load the same
# `leflur-binder-3di` checkpoint — pick this one for peak aggregate pass rate,
# the default for the established/documented recipe.
#
# Sampler recipe (the "best_seq60" arm):
#   seq=Log(exp=-2), struc=Linear, 3Di=Power(exp2); stochasticity_seq=60,
#   stochasticity_struc=60, stochasticity_tri unset; sequence_diversity_penalty=2,
#   no 3Di diversity penalty.
#
# Usage (fetch the checkpoint once, then run against your own target):
#   lobster_leflur_checkpoints fetch leflur-binder-3di
#   uv run python -m lobster.cmdline.generate \
#     --config-name experiment/generate_binder_3di_best paths=public \
#     generation.input_structures=/path/to/target.pdb \
#     generation.target_chain=A generation.epitope_indices="[155]"

defaults:
  - /paths: public
  - _self_

output_dir: "${paths.root_dir}/binder_design_3di_best"

# Random seed for reproducibility
seed: 12345

# Model configuration — registry short name; resolve_checkpoint downloads it.
# Same checkpoint as the default 3Di arm.
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-binder-3di

generation:
  mode: binder_design

  # Target structure (PDB with one or more chains). Defaults to the bundled
  # example target; override with your own PDB via
  # `generation.input_structures=/path/to/target.pdb`.
  input_structures: "${paths.examples.binder_template}"

  # Target chain the binder is designed against (chain letter from the PDB).
  target_chain: "A"

  # Binder length (number of residues to generate). Typical range 50-150.
  binder_length: 50

  # Epitope residue indices (coords_res numbering, 0-indexed). Seeds the binder
  # placement AND (with use_epitope_conditioning) feeds the model's hotspot
  # channel. Override per target.
  epitope_indices: [155]

  # Feed the epitope hotspots into the model's conditioning channel (the
  # complex/epitope-trained checkpoint's docking prior). ON for this arm.
  use_epitope_conditioning: true
  encode_target_only: false

  # --- Sampler recipe (best / seq60) -------------------------------------
  # nsteps=200 reproduces the published Complexa pass rate (7.18%); the sweep
  # driver ran every arm at 200 steps.
  nsteps: 200
  n_trials: 1
  n_designs_per_structure: 10

  temperature_seq: 0.27315634404739075
  temperature_struc: 0.31640411575109995
  # Raised sequence remasking stochasticity is the lever that lifts this arm to
  # 7.18% (from 6.55% at the base seq stochasticity).
  stochasticity_seq: 60
  stochasticity_struc: 60
  asynchronous_sampling: false

  # Per-track inference schedules ("best" arm): the seq/3Di schedules are the
  # mirror image of the a8 default (seq=Log instead of Power, 3Di=Power instead
  # of Log). LogInferenceSchedule's exponent default is already -2; listed for
  # exactness.
  inference_schedule_seq: LogInferenceSchedule
  seq_schedule_exponent: -2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: PowerInferenceSchedule
  tri_schedule_exponent: 2

  # Per-sequence diversity penalty (see generate_binder_3di for rationale). This
  # arm uses NO 3Di diversity penalty (tri_diversity_penalty defaults to 0).
  sequence_diversity_penalty: 2
  sequence_logit_bias_steps: 200

  # ESMFold validation (recommended for binder design)
  use_esmfold: true
  max_length: 512
  esmfold_chain_groups: null

  # CSV metrics and plotting
  save_csv_metrics: true
  create_plots: true
