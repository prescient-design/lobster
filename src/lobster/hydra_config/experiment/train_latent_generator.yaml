# @package _global_
defaults:
  - override /data: structure_pdb
  - override /model: latent_generator
  - override /callbacks: latent_generator_defaults.yaml

compile: false

logger:
  name: latent_generator-tokens_${model.quantizer.n_tokens}-enc_${model.structure_encoder.embed_dim_hidden}-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}  
  project: lobster_latent_generator
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}


paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S} 
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}


trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0


