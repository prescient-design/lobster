# @package _global_
# Training experiment for the 3Di-input Latent Generator variant.
#
# Pipeline: per-residue Foldseek 3Di state (20 classes; recomputed at
# data-load time by `Structure3diTransform`) → learnable embedding → ViT
# decoder → predicted N/CA/C backbone coordinates. No encoder, no
# quantizer; the input is already discrete.
#
# Training data is the SwissProt SFT structures materialised by Step A of
# the SwissProt-LG plan (`prepper/preprocessing/swissprot_structures/`).
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input

defaults:
  # Same dataset as the canonical `LG full attention` training (the PDB monolithic
  # `.pt` files clustered at 40% seq identity), with the 3Di transform chain bolted
  # on so each batch carries `3di_states`.
  #
  # Swap back to the SwissProt structures overlay (once Step A's `structures_v6/`
  # tree lands) with the CLI override:
  #     data=structure_swissprot_with_3di
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input
  - override /callbacks: latent_generator_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  # Parity with `train_latent_generator.yaml`. val.pt is small (~3 MB) so this is
  # effectively "iterate the whole val set".
  limit_val_batches: 50_000
  precision: bf16-mixed
  # Parity with `train_latent_generator.yaml` so effective batch matches the LG
  # full-attention run.
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
