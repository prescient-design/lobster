# @package _global_
#
# SIDE-CHAIN arm: the multi-target SC recipe PLUS two new full-atom side-chain reward
# terms served by the SAME LigandMPNN-repack pool — all-atom side-chain CLASH and
# ProteinMPNN amino-acid recovery (AAR / designability).
#
# This is an exact fork of rl_leflur_binder_grpo_dist_3di_shape_multitgt_stab.yaml; the
# ONLY additions are `grpo.w_sc_clash > 0` and `grpo.w_aar > 0`. Every other knob (the
# 3Di-distribution + clash·contact + 3DZD-shape rewards and their references, Dr.GRPO
# multi-target accum, grad-ckpt spu=3, lr 1e-5, G=64, β=0, tracks, warm-start
# leflur-binder-3di) is byte-identical, so this run is a clean incremental ablation on
# top of the shipped SC arm.
#
#   reward = w_3di_dist     * [ (1-alpha)*(1-D_iface_3di) + alpha*(1-D_binder_3di) ]
#          + w_clash_contact * clash_score * contact_score          # backbone+Cb geometry
#          + w_shape        * SC                                     # 3DZD interface shape
#          + w_sc_clash     * exp(-E_clash_allatom / 150)            # <-- NEW: full-atom clash
#          + w_aar          * AAR_whole_binder                       # <-- NEW: MPNN designability
#
# Offline scoping (scripts/_sc_clash_analyze.py, scripts/_aar_analyze.py) found BOTH new
# terms to be weak *within-arm* pass-selectors (per-target AUROC ~chance) but to carry a
# large DISTRIBUTION gap to the passing Proteina-Complexa model: LeFlur interface all-atom
# clash is ~3-8x Complexa's, and LeFlur whole-binder AAR is ~0.17 vs Complexa's ~0.54.
# They are therefore distribution-MATCHING guardrails, not selectors. CAVEAT: the AAR
# reward optimizes WHOLE-BINDER recovery, and high whole-binder MPNN agreement marks
# generic/degenerate sequences (the anti-predictive failing mode) — watch aar/aar_mean vs
# the AA entropy on wandb for degeneracy collapse; the inference-time sequence/tri
# diversity penalties (below) are the standing guard.
#
# All three repack terms (SC, clash, AAR) come from ONE round-trip per design through the
# repack pool (trainer builds want=("sc","clash","aar")), so enabling AAR/clash adds only
# a small ProteinMPNN forward + a numpy clash sum per design on top of the existing pack.
#
# Usage (Protenix-free policy job; a SEPARATE a10g repack array serves the shape pool,
# which now also computes clash + AAR — needs no extra flags, the worker lazy-loads the
# ProteinMPNN AAR scorer from its default proteinmpnn_v_48_020.pt):
#   OUTBASE=/cv/scratch/u/lisanzas/rl_leflur_binder_grpo_dist_3di_shape_scclash_aar_multitgt_stab \
#   N_WORKERS=0 M_SHAPE=8 \
#   CONFIG=experiment/rl_leflur_binder_grpo_dist_3di_shape_scclash_aar_multitgt_stab \
#     bash scripts/launch_leflur_grpo.slurm

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.root_dir}/rl_leflur_binder_grpo_dist_3di_shape_scclash_aar_multitgt_stab"
seed: 12345

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-binder-3di

# Complexa 38-target set (GRPO schema; per-target fixed length) — parsed by _build_targets.
targets: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_grpo_targets.csv"

# Arm C rollout (epitope conditioning ON; fold-diverse 3Di levers — NOT beta-collapsed best-arm).
generation:
  max_length: 512
  use_epitope_conditioning: true
  encode_target_only: false
  cfg_weight: 1.0
  temperature_seq: 1.0
  temperature_struc: 0.31640411575109995
  stochasticity_seq: 1
  stochasticity_struc: 60
  stochasticity_tri: 80
  asynchronous_sampling: false
  inference_schedule_seq: PowerInferenceSchedule
  seq_schedule_exponent: 2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: LogInferenceSchedule
  tri_schedule_exponent: null
  tri_time_accel: 1.0
  sequence_diversity_penalty: 2
  tri_diversity_penalty: 8
  sequence_logit_bias: null
  sequence_logit_bias_steps: 200
  tri_logit_bias: null

grpo:
  group_size: 64
  num_steps: 2000            # OPTIMIZER updates; each consumes accum_targets rollouts
  rollout_nsteps: 40
  steps_per_update: 3        # grad_checkpoint keeps peak mem ~O(group_size) per target.
  grad_checkpoint: true      # per-packet forward+backward is sequential -> peak mem ~1 target.
  mu: 2
  beta: 0.0                  # KL OFF (deliberately not turned on yet)
  eps_clip: 0.2
  lr: 1.0e-5                 # sole confirmed lever (1e-6 freezes, 1e-4 blows up)
  adv_eps: 1.0e-4
  adv_std_floor: 1.0e-3
  # --- Multi-target stabilization (same as base multitgt-stab arm) ---
  accum_targets: 4           # Option 1: average the gradient over 4 targets per step
  shuffle_targets: true      # Option 3: reshuffle target order each epoch
  normalize_advantage: true  # Option 2: per-group /std (== TRL scale_rewards="group")
  # Confidence combo OFF -> Protenix skipped entirely (no worker pool, no queue).
  w_iptm: 0.0
  w_ptm: 0.0
  w_abag_iptm: 0.0
  w_plddt: 0.0
  w_gpde: 0.0
  w_pae_global: 0.0
  w_pae_interface: 0.0
  # Structure self-consistency off.
  w_sctm_binder: 0.0
  w_sctm_complex: 0.0
  log_struct_diagnostic: false
  # Within-group Jaccard novelty (AA + 3Di) — off; the dist reward self-regularizes.
  w_seq_diversity: 0.0
  w_struct_diversity: 0.0
  # --- Whole-binder + interface 3Di distribution distance reward (same as base) ---
  w_aa_dist: 0.0             # AA distance OFF for the 3Di-only lineage
  w_3di_dist: 1.0            # 3Di histogram closeness to Complexa reference
  dist_binder_frac: 0.5      # alpha: blend interface (0) <-> whole-binder (1); 0.5 = equal
  dist_metric: tv           # total variation (D0 primary); "js" also supported
  # WHOLE-BINDER reference (has aa_binder/3di_binder alongside interface aa/3di).
  dist_reference: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/grpo_dist_reference_complexa38_binder.json"
  # Interface-size collapse guardrail (still overrides the whole term).
  dist_min_iface: 4
  dist_iface_penalty: -1.0
  # --- Smooth clash + interface-contact geometry reward (kept ON, same as base) ---
  w_clash_contact: 1.0
  clash_d_clash: 2.2        # soft-core clash center (A): heavy atoms closer overlap
  clash_soft: 0.5           # clash transition width (A)
  clash_scale: 50.0         # E_clash -> clash_score saturation scale
  contact_d0: 8.0           # interface-band center (A), matches the 8 A interface def
  contact_soft: 1.0         # contact transition width (A)
  frac_lo: 0.05             # iface_frac band: contact_score = 0 at/below this
  frac_peak: 0.16           # iface_frac band: peak (contact_score = 1) -- native band
  frac_hi: 0.4              # iface_frac band: contact_score = 0 at/above this
  clash_seq_sep: 2          # exclude binder pairs within this residue separation
  clash_include_cb: true    # include a virtual Cb atom per residue in the clash cloud
  # --- Full-atom 3DZD interface shape-complementarity reward (SC arm term, kept ON) ---
  w_shape: 1.0              # SC term ∈ [0,1] (clipped Pearson of the two interface 3DZDs)
  # --- NEW full-atom side-chain reward terms (served by the SAME repack pool) ---
  w_sc_clash: 1.0          # all-atom side-chain clash: exp(-E_clash_binder+iface / 150) ∈ (0,1]
  w_aar: 1.0               # whole-binder ProteinMPNN AAR (designability) ∈ [0,1]
  # All of dist (3Di), clash·contact, shape, sc_clash, and aar are functions of the
  # generated structure (side-chain packing is deterministic given the co-generated
  # sequence) -> only the structure/tri tracks receive their advantage.
  tracks: [structure_tokens, tri_tokens]
  capture_old_lp_inline: true
  grad_clip: 1.0
  seed: 0
  log_every: 1
  ckpt_dir: "${output_dir}/ckpts"
  ckpt_every: 25            # finer spacing: fewer optimizer steps (each = 4 rollouts)

reward:
  queue_dir: "${output_dir}/queue"
  targets_csv: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_score_targets.csv"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

# Full-atom repack reward pool (LigandMPNN-repack workers on a10g GPUs). The launcher's
# M_SHAPE sizes the worker array pointed at this queue; n_shards = M_SHAPE fans each group
# across the whole pool (wall-clock = slowest shard). This pool now serves ALL THREE
# full-atom terms (SC + all-atom clash + AAR) from one pack per design; the AAR ProteinMPNN
# scorer is lazily loaded in-worker from its default proteinmpnn_v_48_020.pt. The client
# caches on a coords+seq content hash (rarely hits across rollouts, free when it does).
shape:
  queue_dir: "${output_dir}/shape_queue"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

wandb:
  enabled: true
  project: leflur-grpo
  name: complexa38-dist3di-shape-scclash-aar-multitgt-stab-g64
