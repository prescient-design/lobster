# @package _global_
#
# SIX-TERM GRPO binder reward set, tmol-ΔΔG variant of the finalized e_lj arm
# (rl_leflur_binder_grpo_elj_chainbreak_chord_lc_jaccard_contactband). Protenix-free policy.
# The ONLY change vs that arm is the PRIMARY interface-energy term: the numpy bounded-LJ
# proxy (per_token_pot / w_pt_lj) is replaced by the physics-complete tmol interface ΔΔG
# (Rosetta beta_nov2016) on the SAME LigandMPNN pack — adding the fa_lk / lk_ball desolvation
# and orientation-dependent H-bond physics the numpy LJ lacks. The other five terms are
# byte-identical. See docs/leflur/grpo_two_reward_sets_proposal.tex §5.4 and memory
# next-run-reward-selection / complexa-lj-gap-is-backbone-not-packer.
#
# This is an EXPERIMENT: whether the physics-complete ΔΔG is a better per-token gradient than
# the e_lj proxy for the ~40u backbone-design-headroom signal (Complexa e_lj -27.8 vs our best
# arm +15.6). ΔΔG is scored RIGID single-point (relax=false, ~0.12-0.15 s/design on the packed
# complex — relaxation ~30 s/design is a non-starter for a live reward) and attributed per binder
# residue by cross-chain contact weight, entering as a DENSITY-normalized per-token structure-track
# advantage A_ddg = w_pt_ddg * posnorm(-ddg_eres). ddg_eres is the signed per-residue ΔΔG
# contribution (more-negative = stronger binding = better), already in "larger = worse" convention
# so it is NOT negated (like e_lj). It rides the EXISTING R_SC repack pool via the new "ddg" want
# (ONE pack per design serves ddg + the CHORD SFT designed-sequence draw) — zero new infra.
#
# The six terms:
#   1. tmol ΔΔG (PRIMARY)       per_token_ddg=true, w_pt_ddg=1.0. Rigid interface ΔΔG on the pack.
#   2. chainbreak               w_chainbreak=1.0, count gate. Backbone peptide-bond integrity.
#   3. CHORD SFT (seq)          sft_mu=0.1, expert-context, whole-binder, hard label, phi on.
#   4. LC (linguistic cplx)     w_seq_complexity=1.0, lc_full=0.7. Within-seq anti-degeneracy.
#   5. within-group Jaccard     w_seq_diversity=0.1. Anti-consensus between-design guard.
#   6. interface-contact band   w_clash_contact=1.0, band(f; 0.05, 0.16, 0.40). Docking geometry.
#
# REQUIRES tmol in the a10g repack worker's interpreter (the blessed .venv): the "ddg" want calls
# plm_design_rl.rewards.ddg_packed_all, which lazily imports tmol; without it the worker raises a
# clear install-the-[tmol]-extra error and ddg/scored_frac stays 0.
#
# WATCH: ddg/ddg_total_mean should FALL (lower ΔΔG = better binding); ddg/scored_frac ~1; chainbreak
# metrics improve; sft/ce_loss down, ratio_init ~1.0; diversity/lc_mean HOLD/RISE, lc_degenerate_frac
# near 0; reward/clash_contact + reward/chainbreak + reward/seq_complexity + seq_diversity populated.
#
# Usage (Protenix-free policy; a SEPARATE a10g repack array serves the ddg/CHORD pool):
#   OUTBASE=/cv/scratch/u/lisanzas/rl_leflur_binder_grpo_ddg_chainbreak_chord_lc_jaccard_contactband \
#   N_WORKERS=0 M_SHAPE=8 POLICY_HRS=168 \
#   CONFIG=experiment/rl_leflur_binder_grpo_ddg_chainbreak_chord_lc_jaccard_contactband \
#     bash scripts/launch_leflur_grpo.slurm

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.root_dir}/rl_leflur_binder_grpo_ddg_chainbreak_chord_lc_jaccard_contactband"
seed: 12345

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-binder-3di

# Complexa 38-target set (GRPO schema; per-target fixed length) — parsed by _build_targets.
targets: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_grpo_targets.csv"

# Arm C rollout (epitope conditioning ON; fold-diverse 3Di levers — NOT beta-collapsed best-arm).
generation:
  max_length: 512
  use_epitope_conditioning: true
  encode_target_only: false
  cfg_weight: 1.0
  temperature_seq: 1.0
  temperature_struc: 0.31640411575109995
  stochasticity_seq: 1
  stochasticity_struc: 60
  stochasticity_tri: 80
  asynchronous_sampling: false
  inference_schedule_seq: PowerInferenceSchedule
  seq_schedule_exponent: 2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: LogInferenceSchedule
  tri_schedule_exponent: null
  tri_time_accel: 1.0
  sequence_diversity_penalty: 2
  tri_diversity_penalty: 8
  sequence_logit_bias: null
  sequence_logit_bias_steps: 200
  tri_logit_bias: null

grpo:
  group_size: 64
  num_steps: 2000            # OPTIMIZER updates; each consumes accum_targets rollouts
  rollout_nsteps: 40
  steps_per_update: 3        # grad_checkpoint keeps peak mem ~O(group_size) per target.
  grad_checkpoint: true      # per-packet forward+backward is sequential -> peak mem ~1 target.
  mu: 2
  beta: 0.0                  # KL OFF (deliberately not turned on yet)
  eps_clip: 0.2
  lr: 1.0e-5                 # sole confirmed lever (1e-6 freezes, 1e-4 blows up)
  adv_eps: 1.0e-4
  adv_std_floor: 1.0e-3
  # --- Multi-target stabilization ---
  accum_targets: 10          # average the gradient over 10 targets per step
  shuffle_targets: true      # reshuffle target order each epoch
  normalize_advantage: true  # per-group /std (== TRL scale_rewards="group")

  # ===================== SIX-TERM REWARD SET =====================
  # (1) tmol ΔΔG — PRIMARY, density-normalized per-token structure-track advantage (physics-complete
  #     upgrade of e_lj). Rigid single-point beta_nov2016 interface ΔΔG on the LigandMPNN pack,
  #     attributed per binder residue by contact weight. e_lj proxy (per_token_pot) is OFF.
  per_token_ddg: true
  w_pt_ddg: 1.0
  # ΔΔG physics knobs are WORKER-side (the repack pool is a separate array that does not read this
  # config) — set on the worker via env: LEFLUR_DDG_RELAX (default 0 = rigid single-point,
  # ~0.12-0.15 s/design; relax ~30 s is a non-starter), LEFLUR_DDG_CONTACT_CUTOFF (default 5.0 Å),
  # LEFLUR_DDG_THREADS (default 4). Defaults are the intended settings for this run — no env needed.
  per_token_pot: false       # numpy e_lj proxy OFF — replaced by the physics-complete ΔΔG above

  # (2) chainbreak — backbone peptide-bond integrity (scalar, count gate).
  w_chainbreak: 1.0
  chainbreak_gate: count
  # per-token chainbreak OFF (scalar realism regularizer, matches the offline analysis).

  # (3) CHORD SFT-distillation — dense per-token LigandMPNN sequence supervision (expert-context).
  sft_mu: 0.1
  sft_mu_schedule: null
  sft_use_phi: true
  sft_scope: binder          # distil the WHOLE binder sequence (phi guards the generic core)
  sft_label: hard            # HARD distillation: CE toward MPNN's argmax token
  sft_temperature: 1.0
  sft_masked_only: true
  sft_reward_gate: null
  struct_sft_mu: 0.0         # Protenix fold-consistency struct-SFT OFF (no Protenix this run)

  # (4) LC — per-design saturating linguistic-complexity reward (within-sequence anti-degeneracy).
  w_seq_complexity: 1.0
  lc_full: 0.7               # full credit at LC>=0.7, ramp to 0 at collapse

  # (5) within-group Jaccard novelty — small between-design anti-consensus guard.
  w_seq_diversity: 0.1
  w_struct_diversity: 0.0

  # (6) interface-contact band — soft clash x soft-count contact band on the decoded backbone.
  w_clash_contact: 1.0
  clash_d_clash: 2.2
  clash_soft: 0.5
  clash_scale: 50.0
  contact_d0: 8.0
  contact_soft: 1.0
  frac_lo: 0.05
  frac_peak: 0.16
  frac_hi: 0.4
  clash_seq_sep: 2
  clash_include_cb: true

  # ===================== EXCLUDED TERMS (all OFF) =====================
  # Numpy interface potentials (e_lj/dsasa/n_hb) OFF — the tmol ΔΔG above supersedes them.
  w_pt_lj: 0.0
  w_pt_dsasa: 0.0
  w_pt_hb: 0.0
  pot_with_sasa: false
  # Protenix confidence combo OFF -> oracle skipped entirely (no worker pool, no queue).
  w_iptm: 0.0
  w_ptm: 0.0
  w_abag_iptm: 0.0
  w_plddt: 0.0
  w_gpde: 0.0
  w_pae_global: 0.0
  w_pae_interface: 0.0
  # Structure self-consistency OFF.
  w_sctm_binder: 0.0
  w_sctm_complex: 0.0
  log_struct_diagnostic: false
  # Interface-distribution (3Di-TV) reward OFF and NOT tracked (won't scale past the ref set).
  w_aa_dist: 0.0
  w_3di_dist: 0.0
  log_dist_diagnostic: false
  # 3DZD shape-SC OFF; AAR scalar OFF (its designed seq still feeds the CHORD SFT term).
  w_shape: 0.0
  w_aar: 0.0

  # The SEQUENCE track must be trainable for the SFT gradient to reach the seq head.
  tracks: [structure_tokens, tri_tokens, sequence_tokens]
  capture_old_lp_inline: true
  grad_clip: 1.0
  seed: 0
  log_every: 1
  ckpt_dir: "${output_dir}/ckpts"
  ckpt_every: 25

# ProtenixRewardClient is constructed from this block but is NEVER queried (all conf weights 0,
# no structure/coords), so no Protenix worker pool runs (N_WORKERS=0).
reward:
  queue_dir: "${output_dir}/queue"
  targets_csv: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_score_targets.csv"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

# Full-atom repack reward pool (LigandMPNN-repack workers on a10g GPUs). Serves the tmol ΔΔG "ddg"
# want AND the CHORD SFT designed-sequence draw from one pack per design. REQUIRES tmol in the
# worker interpreter (blessed .venv with the [tmol] extra).
shape:
  queue_dir: "${output_dir}/shape_queue"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

wandb:
  enabled: true
  project: leflur-grpo
  name: complexa38-ddg-chainbreak-chord-lc-jaccard-contactband-g64
