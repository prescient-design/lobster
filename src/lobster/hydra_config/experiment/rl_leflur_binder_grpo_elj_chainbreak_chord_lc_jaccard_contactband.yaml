# @package _global_
#
# CLEAN SIX-TERM GRPO binder reward set (accum_targets=10, seqtrack). Protenix-free policy.
# Finalized 2026-08-25 after the cross-arm interface-energy + chain-break analysis
# (docs/leflur/grpo_two_reward_sets_proposal.tex, memory next-run-reward-selection). This is
# NOT the old shape+chord+dist arm — distribution (3Di-TV), 3DZD shape-SC, AAR, sc-clash, and
# Protenix are all OFF. The six terms are:
#
#   1. e_lj (PRIMARY)            per_token_pot=true, w_pt_lj=1.0. Bounded LJ interface potential
#                               on the LigandMPNN pack, entering as a DENSITY-NORMALIZED PER-TOKEN
#                               structure-track advantage A_lj = w_pt_lj * posnorm(-lj_eres). This
#                               is the ~40u backbone-design-headroom gradient (Complexa e_lj -27.8
#                               vs our best arm +15.6; headroom is intrinsic to the backbone, not
#                               a packing artifact). n_hb/dsasa DENSITY terms OFF (reward-hackable
#                               by interface bloat) -> w_pt_dsasa=0, w_pt_hb=0, pot_with_sasa=false.
#   2. chainbreak               w_chainbreak=1.0, count gate. Backbone peptide-bond integrity
#                               (mean_r * catastrophic-break gate). Chain-break is the mirror of
#                               clash: dead on the packed set but a broken backbone cannot be
#                               packed away, and NO current reward controls it (dense CHORD
#                               seqtrack is the WORST arm at 31% broken vs Complexa 0.5%).
#   3. CHORD SFT (seq)          sft_mu=0.1, expert-context, whole-binder, hard label, phi on.
#                               Dense per-token LigandMPNN sequence distillation.
#   4. LC (linguistic cplx)     w_seq_complexity=1.0, lc_full=0.7. Per-design SATURATING REWARD
#                               reward += w_seq_complexity * clip(LC/lc_full, 0, 1): full credit
#                               once LC>=0.7 (no pressure on already-complex designs), ramping to
#                               0 at collapse. Within-sequence anti-degeneracy (stops the
#                               poly-alanine collapse the CHORD arm drifts into).
#   5. within-group Jaccard     w_seq_diversity=0.1. Small mean-centered between-design k-mer-
#                               Jaccard novelty guard (anti-consensus, NOT a maximization target).
#   6. interface-contact band   w_clash_contact=1.0, band(f; 0.05, 0.16, 0.40). Docking geometry:
#                               soft clash x soft-count contact band on the decoded backbone.
#
# OFF (deliberately): all Protenix confidence (need_conf=false -> oracle never queried, no worker
# pool), structure self-consistency (w_sctm=0), Protenix fold-consistency struct-SFT
# (struct_sft_mu=0), interface-distribution TV reward (w_3di_dist=0, log_dist_diagnostic=false --
# dropped because it is anchored to a fixed Complexa reference that will not scale to more training
# examples), 3DZD shape-SC (w_shape=0), AAR scalar (w_aar=0), all-atom sc-clash (w_sc_clash=0),
# positional Hamming (w_seq_hamming n/a), structural-token diversity (w_struct_diversity=0).
#
# WATCH: pot/e_lj_mean should FALL (lower LJ = better); pot/scored_frac ~1; chainbreak metrics
# should improve (fewer breaks); sft/ce_loss down, ratio_init ~1.0, sft/supervised_tokens_mean ~=
# whole-binder length; diversity/lc_mean HOLD/RISE, diversity/lc_degenerate_frac near 0;
# reward/clash_contact + reward/chainbreak + reward/seq_complexity_term_mean + seq_diversity all
# populated. ppo/grad_norm not swamped.
#
# Usage (Protenix-free policy; a SEPARATE a10g repack array serves the e_lj/SC/CHORD pool):
#   OUTBASE=/cv/scratch/u/lisanzas/rl_leflur_binder_grpo_elj_chainbreak_chord_lc_jaccard_contactband \
#   N_WORKERS=0 M_SHAPE=8 POLICY_HRS=168 \
#   CONFIG=experiment/rl_leflur_binder_grpo_elj_chainbreak_chord_lc_jaccard_contactband \
#     bash scripts/launch_leflur_grpo.slurm

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.root_dir}/rl_leflur_binder_grpo_elj_chainbreak_chord_lc_jaccard_contactband"
seed: 12345

model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-binder-3di

# Complexa 38-target set (GRPO schema; per-target fixed length) — parsed by _build_targets.
targets: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_grpo_targets.csv"

# Arm C rollout (epitope conditioning ON; fold-diverse 3Di levers — NOT beta-collapsed best-arm).
generation:
  max_length: 512
  use_epitope_conditioning: true
  encode_target_only: false
  cfg_weight: 1.0
  temperature_seq: 1.0
  temperature_struc: 0.31640411575109995
  stochasticity_seq: 1
  stochasticity_struc: 60
  stochasticity_tri: 80
  asynchronous_sampling: false
  inference_schedule_seq: PowerInferenceSchedule
  seq_schedule_exponent: 2
  inference_schedule_struc: LinearInferenceSchedule
  inference_schedule_tri: LogInferenceSchedule
  tri_schedule_exponent: null
  tri_time_accel: 1.0
  sequence_diversity_penalty: 2
  tri_diversity_penalty: 8
  sequence_logit_bias: null
  sequence_logit_bias_steps: 200
  tri_logit_bias: null

grpo:
  group_size: 64
  num_steps: 2000            # OPTIMIZER updates; each consumes accum_targets rollouts
  rollout_nsteps: 40
  steps_per_update: 3        # grad_checkpoint keeps peak mem ~O(group_size) per target.
  grad_checkpoint: true      # per-packet forward+backward is sequential -> peak mem ~1 target.
  mu: 2
  beta: 0.0                  # KL OFF (deliberately not turned on yet)
  eps_clip: 0.2
  lr: 1.0e-5                 # sole confirmed lever (1e-6 freezes, 1e-4 blows up)
  adv_eps: 1.0e-4
  adv_std_floor: 1.0e-3
  # --- Multi-target stabilization ---
  accum_targets: 10          # average the gradient over 10 targets per step
  shuffle_targets: true      # reshuffle target order each epoch
  normalize_advantage: true  # per-group /std (== TRL scale_rewards="group")

  # ===================== SIX-TERM REWARD SET =====================
  # (1) e_lj — PRIMARY, density-normalized per-token structure-track advantage.
  per_token_pot: true
  w_pt_lj: 1.0
  w_pt_dsasa: 0.0            # dsasa density OFF (area-term reward hacking)
  w_pt_hb: 0.0              # n_hb density OFF (area-term reward hacking)
  pot_with_sasa: false      # skip the slow buried-dSASA compute (unused)

  # (2) chainbreak — backbone peptide-bond integrity (scalar, count gate).
  w_chainbreak: 1.0
  chainbreak_gate: count
  # per-token chainbreak OFF (scalar realism regularizer, matches the offline analysis).

  # (3) CHORD SFT-distillation — dense per-token LigandMPNN sequence supervision (expert-context).
  sft_mu: 0.1
  sft_mu_schedule: null
  sft_use_phi: true
  sft_scope: binder          # distil the WHOLE binder sequence (phi guards the generic core)
  sft_label: hard            # HARD distillation: CE toward MPNN's argmax token
  sft_temperature: 1.0
  sft_masked_only: true
  sft_reward_gate: null
  struct_sft_mu: 0.0         # Protenix fold-consistency struct-SFT OFF (no Protenix this run)

  # (4) LC — per-design saturating linguistic-complexity reward (within-sequence anti-degeneracy).
  w_seq_complexity: 1.0
  lc_full: 0.7               # full credit at LC>=0.7, ramp to 0 at collapse

  # (5) within-group Jaccard novelty — small between-design anti-consensus guard.
  w_seq_diversity: 0.1
  w_struct_diversity: 0.0

  # (6) interface-contact band — soft clash x soft-count contact band on the decoded backbone.
  w_clash_contact: 1.0
  clash_d_clash: 2.2
  clash_soft: 0.5
  clash_scale: 50.0
  contact_d0: 8.0
  contact_soft: 1.0
  frac_lo: 0.05
  frac_peak: 0.16
  frac_hi: 0.4
  clash_seq_sep: 2
  clash_include_cb: true

  # ===================== EXCLUDED TERMS (all OFF) =====================
  # Protenix confidence combo OFF -> oracle skipped entirely (no worker pool, no queue).
  w_iptm: 0.0
  w_ptm: 0.0
  w_abag_iptm: 0.0
  w_plddt: 0.0
  w_gpde: 0.0
  w_pae_global: 0.0
  w_pae_interface: 0.0
  # Structure self-consistency OFF.
  w_sctm_binder: 0.0
  w_sctm_complex: 0.0
  log_struct_diagnostic: false
  # Interface-distribution (3Di-TV) reward OFF and NOT tracked (won't scale past the ref set).
  w_aa_dist: 0.0
  w_3di_dist: 0.0
  log_dist_diagnostic: false
  # 3DZD shape-SC OFF; AAR scalar OFF (its designed seq still feeds the CHORD SFT term).
  w_shape: 0.0
  w_aar: 0.0

  # The SEQUENCE track must be trainable for the SFT gradient to reach the seq head.
  tracks: [structure_tokens, tri_tokens, sequence_tokens]
  capture_old_lp_inline: true
  grad_clip: 1.0
  seed: 0
  log_every: 1
  ckpt_dir: "${output_dir}/ckpts"
  ckpt_every: 25

# ProtenixRewardClient is constructed from this block but is NEVER queried (all conf weights 0,
# no structure/coords), so no Protenix worker pool runs (N_WORKERS=0).
reward:
  queue_dir: "${output_dir}/queue"
  targets_csv: "/cv/scratch/u/lisanzas/denovo_dataset/binder/denovo/complexa_bench/targets/complexa_score_targets.csv"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

# Full-atom repack reward pool (LigandMPNN-repack workers on a10g GPUs). Serves the e_lj "pot"
# want AND the CHORD SFT designed-sequence draw from one pack per design.
shape:
  queue_dir: "${output_dir}/shape_queue"
  timeout_s: 1800
  poll_s: 2.0
  cache: true
  n_shards: 8

wandb:
  enabled: true
  project: leflur-grpo
  name: complexa38-elj-chainbreak-chord-lc-jaccard-contactband-g64
