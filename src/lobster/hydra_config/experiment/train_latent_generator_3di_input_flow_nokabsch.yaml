# @package _global_
# Step S -- plain flow with no Kabsch optimal-transport coupling.
# Augmentation pipeline: keeps `random_so3_aug=true` (which previously
# was absorbed by the Kabsch alignment); drops `augmentation_type=kabsch`
# in the moco interpolant. Same dataset, same ~20.6M architecture, and
# same hyperparameters as the existing plain-flow run -- the ONLY delta
# is the OT/Kabsch coupling.
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input_flow_nokabsch

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow_nokabsch
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_nokabsch-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_nokabsch
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
