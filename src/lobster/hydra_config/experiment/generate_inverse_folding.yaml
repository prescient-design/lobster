# @package _global_

# Example configuration for inverse folding (sequence design for given structures)
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/generate_inverse_folding

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/inverse_folding_canonical"

# Random seed for reproducibility
seed: 54321

# Model configuration — canonical TED checkpoint.
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-ted

# Generation settings
generation:
  mode: inverse_folding
  nsteps: 200          # Fewer steps for inverse folding
  batch_size: 1        # Process 1 structures at a time
  n_trials: 1          # Number of trials for best output selection
  
  #Generation parameters
  temperature_seq: 0.16423763902324678    
  temperature_struc: 1.0  
  stochasticity_seq: 20 
  stochasticity_struc: 10

  enable_sequence_token_check: true
  sequence_token_check_retries: 500

  n_designs_per_structure: 1  # Number of designs to generate per structure
  # Input structures - update these paths to your PDB files
  # Examples of different input formats:
  # Single file: input_structures: "/path/to/structure.pdb"
  # Directory: input_structures: "/path/to/pdb/directory/"
  # Glob pattern: input_structures: "/path/to/structures/*.pdb"
  # List of files: input_structures: ["/path/to/file1.pdb", "/path/to/file2.pdb"]
  input_structures: "${paths.benchmarks.multiflow_test}/*.pt"

  # Enable ESMFold validation
  use_esmfold: true
  max_length: 512
  
  # Not used for inverse folding
  length: null
  num_samples: null
