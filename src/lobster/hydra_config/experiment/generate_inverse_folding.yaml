# @package _global_

# Tier-1 inverse-folding generation config — reproduces paper
# Table `inverse_folding_cameo` (CAMEO 2022, N=127). Hyperparameters
# follow the IF row of Appendix `tab:supp_sampling_params_protein`:
# N=100, τ_seq=0.150, τ_struct=0.418, Stoch_seq=10, Stoch_struct=50,
# Sched_seq=Log (model default), Sched_struct=Linear (model default).
#
# (Note: the inverse-folding runner only updates sequence tokens —
# structure tokens are kept fixed at the input — so the τ_struct /
# Stoch_struct knobs do not affect the output. They are listed here
# for parity with the paper appendix table only; the seq-side knobs
# are what produce the published metrics.)
#
# Default checkpoint: `leflur-ted` (the paper's published 470M SLQ model).
#
# Usage: uv run python -m lobster.cmdline.generate \
#          --config-name experiment/generate_inverse_folding paths=public

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/inverse_folding_canonical"

# Random seed for reproducibility (matches the published research run).
seed: 54321

# Model configuration — canonical TED checkpoint.
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-ted

# Generation parameters — paper IF row of `tab:supp_sampling_params_protein`.
generation:
  mode: inverse_folding
  nsteps: 100             # N=100 (paper IF)
  batch_size: 1
  n_trials: 1

  # Paper IF sampling temperatures + stochasticities.
  temperature_seq: 0.150
  temperature_struc: 0.418
  stochasticity_seq: 10
  stochasticity_struc: 50

  enable_sequence_token_check: true
  sequence_token_check_retries: 100

  n_designs_per_structure: 1  # Number of designs to generate per structure

  # CAMEO 2022 valid-set is the paper's published inverse-folding
  # benchmark. To run on MultiFlow test instead, override with
  # `generation.input_structures="${paths.benchmarks.multiflow_test}/*.pt"`.
  input_structures: "${paths.benchmarks.cameo}/*.pt"

  # ESMFold validation produces the published TM-score / pLDDT / RMSD metrics.
  use_esmfold: true
  max_length: 512

  # Not used for inverse folding
  length: null
  num_samples: null
