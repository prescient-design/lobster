# @package _global_
# Step Y3 -- BASE velocity + mini3di CE-from-coords aux. Resumes from
# the prior 3Di-CE champion to re-fit the input embedding against the
# corrected 3Di tokens.
#
# Identical to `train_latent_generator_3di_input_flow_nokabsch_velocity_base_3di_coord_ce`
# except for the logger/project name (separate W&B project so the
# resumed run's panels are isolated from the parent run's history).
#
# Usage:
#   uv run python -m lobster.cmdline.train +experiment=train_latent_generator_3di_input_flow_nokabsch_velocity_base_3di_coord_ce_correct_cb

defaults:
  - override /data: structure_pdb_with_3di
  - override /model: latent_generator_3di_input_flow_nokabsch_velocity_base_3di_coord_ce
  - override /callbacks: latent_generator_flow_defaults.yaml

compile: false

logger:
  name: latent_generator_3di_input_flow_nokabsch_velocity_base_3di_coord_ce_correct_cb-dec_${model.decoder_factory.decoder_mapping.vit_decoder.struc_token_dim}_${data.datasets}_${paths.timestamp}
  project: lobster_latent_generator_3di_input_flow_nokabsch_velocity_base_3di_coord_ce_correct_cb
  entity: null
  save_dir: ${oc.env:LOBSTER_RUNS_DIR}

paths:
  timestamp: ${now:%Y-%m-%d}T${now:%H-%M-%S}
  output_dir: ${paths.root_dir}/${paths.timestamp}
  root_dir: ${oc.env:LOBSTER_RUNS_DIR}

trainer:
  num_nodes: 1
  max_epochs: -1
  gradient_clip_val: 0.5
  max_time: null
  max_steps: -1
  val_check_interval: null
  limit_val_batches: 50_000
  precision: bf16-mixed
  accumulate_grad_batches: 16
  devices: auto
  num_sanity_val_steps: 0
