# @package _global_

# Example configuration for forward folding (structure generation from input sequences and structures)
# Forward folding takes input structures and their sequences, then generates new structures
# Sequences are automatically tokenized using AminoAcidTokenizerTransform
# Usage: uv run python -m lobster.cmdline.generate --config-name experiment/generate_forward_folding

# Output directory

defaults:
  - /paths: internal
  - _self_

output_dir: "${paths.evaluations.out_root}/forward_folding_canonical"

# Random seed for reproducibility
seed: 54321

# Model configuration — canonical BASE checkpoint.
#
# BASE is the default for forward folding because it reproduces the
# published CAMEO TM-score (0.665 on B200 vs 0.67 in the paper) with the
# research hyperparameters used at publication time
# (see `slurm/scripts/eval_leflur_forward_cameo_public_verify.sh` for
# the exact incantation). TED is *also* a valid choice and was the
# original canonical for the paper, but its predictions sit closer to
# the argmax decision boundary on several CAMEO targets and therefore
# regress by ~0.08 TM on newer GPUs (e.g. B200) due to non-determinism
# in cuBLAS / cuDNN / TF32 tensor cores. Pass
# `model.ckpt_path=leflur-ted` to switch to the TED variant.
model:
  _target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
  ckpt_path: leflur-base

# Generation settings
generation:
  mode: forward_folding
  nsteps: 100          # More steps for forward folding
  batch_size: 1        # Process 2 structures at a time
  n_trials: 1          # Number of trials for best output selection
  
  #Generation parameters
  temperature_seq: 0.2967457760634187    
  temperature_struc: 0.1102551183666233  
  stochasticity_seq: 10 
  stochasticity_struc: 30
  
  # Input structures - update these paths to your structure files
  # Examples of different input formats:
  # Single file: input_structures: "/path/to/structure.pdb"
  # Directory: input_structures: "/path/to/structure/directory/"
  # Glob pattern: input_structures: "/path/to/structures/*.pdb"
  # List of files: input_structures: ["/path/to/file1.pdb", "/path/to/file2.pdb"]
  input_structures: "${paths.benchmarks.multiflow_test}/*.pt"
  
  # Maximum length for structures
  max_length: 512
  
  # Not used for forward folding
  length: null
  num_samples: null

  # ESMFold structure validation toggle. Declared here so it can be
  # flipped via `generation.use_esmfold=true` on the CLI without
  # needing the `+` add-key prefix; the runner reads it via
  # `cfg.generation.get("use_esmfold", False)` in any case.
  use_esmfold: false
