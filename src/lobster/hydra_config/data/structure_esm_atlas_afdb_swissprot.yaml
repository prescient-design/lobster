defaults:
  - sampler: randomized_minority_upsampler.yaml # Dataloader batch sampler
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml # Dataset transforms
  - collate_fn: collate_fn_backbone_binder_target.yaml # Collate function for the dataloader

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/ume/simplefold_dataset/train_processed/ # Root directory (not used when path_to_datasets is specified)
path_to_datasets: ["/cv/data/ai4dd/data2/ume/simplefold_dataset/train_processed","/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed", "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed"]
max_length: 512 # Maximum length of the sequence
cluster_file_list: [null, null, null] # Optional: path to cluster file for deduplication
files_to_keep_list: [null, null, null] # Optional: path to file containing list of files to keep
testing: false
use_shards: false
datasets: esm_atlas_afdb_swissprot

# Dataloader Params
batch_size: 40 # Batch size for the dataloader
num_workers: 12 # Number of workers for the dataloader

