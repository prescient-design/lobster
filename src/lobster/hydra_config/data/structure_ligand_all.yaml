defaults:
  - sampler: randomized_minority_upsampler.yaml
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml
  - ligand_transform_fn: structure_ligand_transform.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data/lisanzas/structure_tokenizer/studies/data/pinder/processed_atom/pdb/all/temp/

# Full combined training: PDB + AFDB + PDBBind + SAIR + PLINDER + Distillation + Redesign
#
# Protein-only:
#   PDB:              280k samples, seqid40 clusters (49,441)
#   AFDB SwissProt:   220k samples, swissprot clusters (84,573)
#
# Protein-ligand:
#   PDBBind:          22k samples, SMILES clusters (17,267)
#   SAIR:            280k samples, MMseqs2 40% seqID clusters (2,039)
#   PLINDER:          60k samples, SMILES clusters (22,237)
#   Distillation:    1.7k samples, SMILES clusters (240) — Proteina-Complexa de novo binders
#   Redesign:        1.3k samples, SMILES clusters (1,246) — LigandMPNN redesigns w/ alt_sequences
#
# balance_datasets=true with max_cluster_replicates=5 to cap upsampling of small datasets
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/train/",
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/train/",
  "/cv/scratch/u/lisanzas/plinder_processed/train/",
  "/cv/scratch/u/lisanzas/distillation_dataset/train/",
  "/cv/scratch/u/lisanzas/plinder_redesigned/train/",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/val/",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/test/"
]
max_length: 512

dataset_types: ["structure", "structure", "ligand", "ligand", "ligand", "ligand", "ligand", "ligand", "ligand"]

cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/pdbbind_ligand_smiles_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/sair_mmseqs_seqid40_clusters.pt",
  "/cv/scratch/u/lisanzas/plinder_processed/plinder_ligand_smiles_clusters.pt",
  "/cv/scratch/u/lisanzas/distillation_dataset/ligand_smiles_clusters.pt",
  "/cv/scratch/u/lisanzas/plinder_redesigned/ligand_smiles_clusters.pt",
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null, null, null, null]
use_ligand_dataset: true
testing: false
datasets: all_pl_datasets
use_shards: false
balance_datasets: true
max_cluster_replicates: 5

batch_size: 8
num_workers: 12
