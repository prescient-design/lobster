defaults:
  - sampler: randomized_minority_upsampler.yaml
  - transform_fn: structure_backbone_aa_tokenizer_alt_seq_transform.yaml
  - collate_fn: collate_fn_backbone_binder_target.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/

# Synthetic-sequence-ONLY ablation: De Novo + TED + CATH (SS-balanced clusters),
# NO PDB and NO AFDB. All three sources carry synthetic (LigandMPNN/Caliby,
# ESMFold-filtered) sequences; they differ only in backbone provenance
# (denovo = generated backbones; TED/CATH = real AlphaFold/experimental domains).
# Complements structure_pdb_afdb_no_distill.yaml (native-sequence-only) and uses
# the SAME ss-balanced cluster files as the published LeFlur-p recipe
# (structure_pdb_afdb_denovo_ted_cath_ss_balanced.yaml).
# - De Novo: 772k synthetic structures from 4 generative models × 5 lengths
# - TED: novel/high-symmetry AlphaFold domains (4,323 clusters)
# - CATH: CATH S40 experimental domains (4,702 clusters)
# - Validation: AFDB CAMEO set   - Test: AFDB multiflow set
path_to_datasets: [
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/train_processed_pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed"
]
max_length: 512

cluster_file_list: [
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/denovo_clusters_ss_balanced_v2.pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/ted_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/cath_clusters_ss_balanced.pt",
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null]
testing: false
use_shards: false
datasets: denovo_ted_cath_ss_balanced
balance_datasets: true

batch_size: 100
num_workers: 12
