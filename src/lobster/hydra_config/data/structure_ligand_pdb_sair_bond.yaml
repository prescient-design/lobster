defaults:
  - transform_fn: structure_backbone_transform.yaml # Dataset transforms
  - ligand_transform_fn: structure_ligand_transform.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /data/lisanzas/structure_tokenizer/studies/data/pinder/processed_atom/pdb/all/temp/ # not used

# Datasets with bond matrices (preprocessed 12/15/25):
# - PDB: protein-only (clustered at 40% seq identity)
# - GEOM: ligand conformers with bond_matrix from SDF files
# - PDBBind: protein-ligand pairs with bond_matrix from SDF files
# - SAIR: protein-ligand pairs with bond_matrix from SMILES
path_to_datasets: [
  "/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",  # PDB train
  "/data2/lisanzas/geom_12_15_25/train/",                                 # GEOM train (with bond_matrix)
  "/data2/lisanzas/pdb_bind_12_15_25/train/",                             # PDBBind train (with bond_matrix)
  "/data2/lisanzas/sair_12_15_25/train/",                                 # SAIR train (with bond_matrix)
  "/data2/lisanzas/pdb_bind_12_15_25/val/",                               # PDBBind val
  "/data2/lisanzas/pdb_bind_12_15_25/test/"                               # PDBBind test
]
max_length: 512 # Maximum length of the sequence; not used

# Per-dataset type specification
# 'structure' = protein-only (uses StructureDataset)
# 'ligand' = ligand-only or protein-ligand pairs (uses LigandDataset)
dataset_types: ["structure", "ligand", "ligand", "ligand", "ligand", "ligand"]

# Cluster file for PDB dataset (sequence clustering)
cluster_file_list: [
  "/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt",
  null, null, null, null, null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null]
use_ligand_dataset: true
testing: false
datasets: ligand_pdb_geom_pbind_sair_bond  # New name to distinguish from old config
use_shards: false

# Dataloader Params
# Note: batch_size reduced from 40 to 8 for memory efficiency with bond prediction
batch_size: 8
num_workers: 12

