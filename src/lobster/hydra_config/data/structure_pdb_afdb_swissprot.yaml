defaults:
  - sampler: randomized_minority_upsampler.yaml # Dataloader batch sampler
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml # Dataset transforms
  - collate_fn: collate_fn_backbone_binder_target.yaml # Collate function for the dataloader

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/ # Base directory
# Training: PDB train + AFDB SwissProt train, Validation: AFDB SwissProt val, Test: AFDB SwissProt test
path_to_datasets: ["/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt", "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed", "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed", "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed"]
max_length: 512 # Maximum length of the sequence; not used
# Cluster files: one for PDB, one for AFDB SwissProt
cluster_file_list: ["/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt", "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters.pt"]
files_to_keep: null # this doesnt do anything
files_to_keep_list: [null, null] # No filtering for either dataset
testing: false
use_shards: false
datasets: pdb_afdb_swissprot

# Dataloader Params
batch_size: 100 # Batch size for the dataloader
num_workers: 12 # Number of workers for the dataloader
