defaults:
  - sampler: randomized_minority_upsampler.yaml # Balanced sampling across datasets
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml # Dataset transforms (includes AminoAcidTokenizerTransform)
  - ligand_transform_fn: structure_ligand_transform.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data/lisanzas/structure_tokenizer/studies/data/pinder/processed_atom/pdb/all/temp/ # not used

# Datasets with bond matrices (preprocessed 12/15/25) + AFDB SwissProt:
# - PDB: protein-only, 278k structures (clustered at 40% seq identity)
# - AFDB SwissProt: protein-only, 198k structures from AlphaFold DB
# - GEOM: ligand conformers with bond_matrix, 247k
# - PDBBind: protein-ligand complexes with bond_matrix, 44k train / 5.5k val / 5.5k test
# - SAIR: protein-ligand complexes with bond_matrix, 560k
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",  # PDB train (278k)
  "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed",                                 # AFDB SwissProt train (198k)
  "/cv/data/ai4dd/data2/lisanzas/geom_12_15_25/train/",                                 # GEOM train (247k)
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/train/",                             # PDBBind train (44k)
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/train/",                                 # SAIR train (560k)
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/val/",                               # PDBBind val (5.5k)
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/test/"                               # PDBBind test (5.5k)
]
max_length: 512

# Per-dataset type specification
# 'structure' = protein-only (uses StructureDataset)
# 'ligand' = ligand-only or protein-ligand pairs (uses LigandDataset)
dataset_types: ["structure", "structure", "ligand", "ligand", "ligand", "ligand", "ligand"]

# Cluster files: PDB cluster, AFDB SwissProt cluster, null for ligand datasets
cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters.pt",
  null, null, null, null, null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null, null]
use_ligand_dataset: true
testing: false
datasets: ligand_pdb_afdb_geom_pbind_sair_bond
use_shards: false

# Dataloader Params
batch_size: 8
num_workers: 12
