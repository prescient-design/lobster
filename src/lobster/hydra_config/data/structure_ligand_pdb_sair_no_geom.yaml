defaults:
  - sampler: randomized_minority_upsampler.yaml # Balanced sampling across datasets
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml # Dataset transforms (includes AminoAcidTokenizerTransform)
  - ligand_transform_fn: structure_ligand_transform.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data/lisanzas/structure_tokenizer/studies/data/pinder/processed_atom/pdb/all/temp/ # not used

# Datasets WITHOUT GEOM (no ligand-only):
# - PDB: protein-only (clustered at 40% seq identity)
# - PDBBind: protein-ligand pairs with bond_matrix from SDF files
# - SAIR: protein-ligand pairs with bond_matrix from SMILES
#
# Effective proportions (round-robin): 
#   - Protein-only: ~33%
#   - Protein-ligand: ~67%
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",  # PDB train
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/train/",                             # PDBBind train (with bond_matrix)
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/train/",                                 # SAIR train (with bond_matrix)
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/val/",                               # PDBBind val
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/test/"                               # PDBBind test
]
max_length: 512 # Maximum length of the sequence; not used

# Per-dataset type specification
# 'structure' = protein-only (uses StructureDataset)
# 'ligand' = ligand-only or protein-ligand pairs (uses LigandDataset)
dataset_types: ["structure", "ligand", "ligand", "ligand", "ligand"]

# Cluster files: PDB (seqid40), PDBBind (MMseqs2 40%), SAIR (MMseqs2 40%), val, test
cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/pdbbind_mmseqs_seqid40_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/sair_mmseqs_seqid40_clusters.pt",
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null]
use_ligand_dataset: true
testing: false
datasets: pdb_pbind_sair_no_geom  # New name for this config
use_shards: false
balance_datasets: true  # Equalize sampling: PDB, PDBBind, SAIR each ~33%

# Dataloader Params
batch_size: 8
num_workers: 12

