defaults:
  - sampler: randomized_minority_upsampler.yaml
  - transform_fn: atom14_then_structure_complex_aa_tokenizer_alt_seq_chain_remap_transform.yaml
  - collate_fn: collate_fn_backbone_binder_target.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/

# A/B/C variant: Pinder listed THREE times -> share = 3/8 = 37.5%.
# Same mechanics as the pinder2x yaml: each entry instantiates a
# separate StructureDataset over the same files, ConcatDataset assigns
# them disjoint global index ranges, RandomizedMinorityUpsampler shuffles
# each independently. Three Pinder sources -> ~18 Pinder samples per
# batch=48 (vs ~14 for x2 and ~8 for x1).
#
# Memory cost: Pinder cluster file + filename list loaded 3 times
# (~500 MB extra RAM total). Use --mem=384G.
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed",
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/train_processed_pt",
  # Pinder x3 -- the only diff vs the baseline yaml.
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/train_pdb_processed",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/train_pdb_processed",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/train_pdb_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/val_pdb_processed"
]
max_length: 512

cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters_ss_balanced.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/denovo_clusters_ss_balanced_v2.pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/ted_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/cath_clusters_ss_balanced.pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/pinder_systemid_clusters_train.pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/pinder_systemid_clusters_train.pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/pinder_systemid_clusters_train.pt",
  null,
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null, null, null, null, null, null]
testing: false
use_shards: false
datasets: leflur_p_plus_pinder_complex_chainembed_pinder3x
balance_datasets: true

batch_size: 100
num_workers: 12
