defaults:
  - sampler: randomized_minority_upsampler.yaml # Dataloader batch sampler
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml # Dataset transforms
  - collate_fn: collate_fn_backbone_binder_target.yaml # Collate function for the dataloader

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/AFDB/ # Base directory for AFDB dataset
# Note: Datamodule checks for "train", "val", or "test" in path names
# "valid_cameo_processed" contains "val" so it should be detected as validation set
path_to_datasets: ["/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed", "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed", "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed"]
max_length: 512 # Maximum length of the sequence; not used
cluster_file: /cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters.pt
files_to_keep: null # this doesnt do anything
testing: false
use_shards: false
datasets: afdb_swissprot

# Dataloader Params
batch_size: 40 # Batch size for the dataloader
num_workers: 12 # Number of workers for the dataloader

