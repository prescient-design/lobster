defaults:
  - sampler: randomized_minority_upsampler.yaml
  - transform_fn: structure_backbone_aa_tokenizer_transform.yaml
  - ligand_transform_fn: structure_ligand_transform.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data/lisanzas/structure_tokenizer/studies/data/pinder/processed_atom/pdb/all/temp/

# PDB + AFDB + PDBBind + SAIR (NO GEOM)
# - PDB: protein-only, 278k (seqid40 clusters)
# - AFDB SwissProt: protein-only, 198k (swissprot clusters)
# - PDBBind: protein-ligand, 22k (MMseqs2 40% clusters)
# - SAIR: protein-ligand, 280k (MMseqs2 40% clusters)
# balance_datasets: true → ~25% each
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/train/",
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/train/",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/val/",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/test/"
]
max_length: 512

dataset_types: ["structure", "structure", "ligand", "ligand", "ligand", "ligand"]

# Cluster files for all 4 train datasets
cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/pdb_bind_12_15_25/pdbbind_mmseqs_seqid40_clusters.pt",
  "/cv/data/ai4dd/data2/lisanzas/sair_12_15_25/sair_mmseqs_seqid40_clusters.pt",
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null]
use_ligand_dataset: true
testing: false
datasets: pdb_afdb_pbind_sair_no_geom
use_shards: false
balance_datasets: true

# Dataloader Params
batch_size: 8
num_workers: 12
