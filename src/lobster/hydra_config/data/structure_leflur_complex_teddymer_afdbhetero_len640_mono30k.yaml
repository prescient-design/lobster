defaults:
  - sampler: randomized_minority_upsampler.yaml
  - transform_fn: atom14_then_structure_complex_aa_tokenizer_alt_seq_chain_remap_transform.yaml
  - collate_fn: collate_fn_backbone_binder_target.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/

# mono30k variant of structure_leflur_complex_teddymer_afdbhetero_len640: trim the monomer
# sources (PDB/AFDB/denovo) to 30k clusters/epoch with NO upsampling (replicate 1x) so their
# per-epoch share drops ~48% -> ~31%, shifting weight to the complex sources. Everything else
# identical. Resulting per-epoch shares (index ~280.5k): PDB 10.7 / AFDB 10.7 / denovo 9.4 /
# pinder 15.4 / sabdab 11.0 / teddymer 21.4 / afdb_hetero 21.4  (monomer 30.8%, complex 69.2%).
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed",
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/train_processed_pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/train_pdb_processed",
  "/cv/scratch/u/lisanzas/sabdab_atom14/train_pdb_processed",
  "/cv/scratch/u/lisanzas/teddymer_atom14/train_pdb_processed",
  "/cv/scratch/u/lisanzas/afdb_hetero_atom14/train_pdb_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/val_pdb_processed",
  "/cv/scratch/u/lisanzas/sabdab_atom14/val_pdb_processed"
]
max_length: 640

cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters_ss_balanced.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/denovo_clusters_ss_balanced_v2.pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/ted_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/cath_clusters_ss_balanced.pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/pinder_systemid_clusters_train.pt",
  "/cv/scratch/u/lisanzas/sabdab_atom14/sabdab_clusters_train.pt",
  "/cv/scratch/u/lisanzas/teddymer_atom14/teddymer_clusters_train.pt",
  "/cv/scratch/u/lisanzas/afdb_hetero_atom14/afdb_hetero_clusters_train.pt",
  null,
  null,
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null, null, null, null, null, null, null, null]
testing: false
use_shards: false
datasets: leflur_complex_teddymer_afdbhetero_mono30k
balance_datasets: true

# Per-source knobs POSITIONAL, aligned to the 9 TRAIN sources (path order):
#   0 PDB  1 AFDB(monomer)  2 denovo  3 TED  4 CATH  5 pinder  6 sabdab  7 teddymer  8 afdb_hetero
# Monomers (0,1,2) capped to 30k AND replicate 1x -> the cap sticks (not upsampled back to max),
# so monomer share drops. teddymer/afdb (7,8) stay capped at 60k (rotating). sabdab (6) 10x.
per_source_cluster_caps: [30000, 30000, 30000, null, null, null, null, 60000, 60000]
max_cluster_replicates: 5
max_cluster_replicates_per_source: [1, 1, 1, null, null, null, 10, null, null]

batch_size: 100
num_workers: 12
