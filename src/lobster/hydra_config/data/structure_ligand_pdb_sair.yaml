defaults:
  - transform_fn: structure_backbone_transform.yaml # Dataset transforms
  - ligand_transform_fn: structure_ligand_transform.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data/lisanzas/structure_tokenizer/studies/data/pinder/processed_atom/pdb/all/temp/ # this doesnt do anything
path_to_datasets: ["/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt", "/cv/data/ai4dd/data/bucket/lisanza/structures/GEOM/processed/train/", "/cv/data/ai4dd/data2/lisanzas/pdb_bind/train/","/cv/data/ai4dd/data2/lisanzas/sair_protein_ligand/train/", "/cv/data/ai4dd/data2/lisanzas/pdb_bind/val/", "/cv/data/ai4dd/data2/lisanzas/pdb_bind/test/"]
max_length: 512 # Maximum length of the sequence; not used

# Per-dataset type specification
# 'structure' = protein-only (uses StructureDataset)
# 'ligand' = ligand-only or protein-ligand pairs (uses LigandDataset)
dataset_types: ["structure", "ligand", "ligand", "ligand", "ligand", "ligand"]  # PDB, GEOM, PDBBind train/val/test

cluster_file_list: ["/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters.pt", null, null, null, null, null]
files_to_keep: null # this doesnt do anything
files_to_keep_list: [null, null, null, null, null, null] # No filtering for any dataset
use_ligand_dataset: true  # Kept for backwards compatibility
testing: false
datasets: ligand_pdb_geom_pbind_sair
use_shards: false

# Dataloader Params
batch_size: 40 # Batch size for the dataloader
num_workers: 12 # Number of workers for the dataloader
