defaults:
  - sampler: randomized_minority_upsampler.yaml
  # New transform chain: same as the prior chainembed yaml but with
  # StructureComplexTransform (interface-anchored crop strategy)
  # replacing StructureBackboneTransform. Adds `epitope_tensor` and
  # `paratope_tensor` to every batch (zeros for monomers) so the
  # lightning module's `get_gen_gt_and_conditioning_tensor` actually
  # populates the `conditioning_tensor` from real interface residues
  # for Pinder dimers, instead of silently leaving it all-zeros (the
  # bug we hit in `structure_leflur_p_plus_pinder_chainembed.yaml`).
  - transform_fn: atom14_then_structure_complex_aa_tokenizer_alt_seq_chain_remap_transform.yaml
  - collate_fn: collate_fn_backbone_binder_target.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/

# Same train mix as `structure_leflur_p_plus_pinder_chainembed.yaml`
# (5 monomer sources + Pinder train as 6th). Val/test paths differ:
#  * Existing monomer val (CAMEO) kept for cross-dataset regression check.
#  * Pinder val ADDED so val_loss reflects dimer behaviour too.
#    The datamodule's val-dataset construction picks any path with "val"
#    in the string (see `_coord_structure_datamodule.py`), so just adding
#    the Pinder val path here gets it included automatically.
path_to_datasets: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/split_data/train.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/train_processed",
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/train_processed_pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/train_processed_pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/train_pdb_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed",
  # Pinder val dimers. Interface-anchored crop in the transform chain
  # collapses dimers > max_length=512 down to the binding region rather
  # than to a single chain, so all Pinder val systems remain dimers in
  # the eval loop -- mirrors what the callbacks see.
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/val_pdb_processed"
]
max_length: 512

# cluster_file_list aligned to path_to_datasets order. Val/test paths get
# `null` since the train-time clustering isn't used at eval.
cluster_file_list: [
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pdb_data/pdb_seqid40_clusters_ss_balanced.pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/pdb_swissprot_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/denovo_clusters_ss_balanced_v2.pt",
  "/cv/scratch/u/lisanzas/ted_ume_dataset/ume_dataset/ted_clusters_ss_balanced.pt",
  "/cv/scratch/u/lisanzas/cath_dataset/ume_dataset/cath_clusters_ss_balanced.pt",
  "/cv/data/ai4dd/data2/lisanzas/latent_generator_files/pinder_atom14/pinder_systemid_clusters_train.pt",
  null,
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null, null, null, null, null, null, null]
testing: false
use_shards: false
datasets: leflur_p_plus_pinder_complex_chainembed
balance_datasets: true

batch_size: 100
num_workers: 12
