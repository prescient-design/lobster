defaults:
  - sampler: randomized_minority_upsampler.yaml
  - transform_fn: structure_backbone_aa_tokenizer_alt_seq_transform.yaml
  - collate_fn: collate_fn_backbone_binder_target.yaml

_target_: lobster.data._coord_structure_datamodule.StructureLightningDataModule
root: /cv/data/ai4dd/data2/lisanzas/

# Ablation of structure_pdb_afdb_denovo.yaml trained ONLY on the synthetic de novo
# distillation set (no PDB, no AFDB SwissProt). Complements
# structure_pdb_afdb_no_distill.yaml so we can bracket the contribution of the
# synthetic data: natural-only vs synthetic-only vs both.
# - De Novo train: 772k synthetic structures from 4 generative models × 5 lengths,
#   18,109 TM-score clusters, with alternative_sequences for sequence diversity
# - Validation: AFDB CAMEO set (shared across all ablations for comparability)
# - Test: AFDB multiflow set
# train_processed_pt is a symlink -> processed_pt (the 772k synthetic .pt files);
# the "train" in the name is required for the datamodule to detect the train split.
path_to_datasets: [
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/train_processed_pt",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed",
  "/cv/data/ai4dd/data2/lisanzas/AFDB/test_multiflow_processed"
]
max_length: 512

cluster_file_list: [
  "/cv/scratch/u/lisanzas/denovo_dataset/ume_dataset/denovo_clusters.pt",
  null,
  null
]

files_to_keep: null
files_to_keep_list: [null, null, null]
testing: false
use_shards: false
datasets: denovo_only
balance_datasets: true

batch_size: 100
num_workers: 12
