_target_: lobster.model.leflur.LeFlurSequenceStructureEncoderLightningModule
lr: 1e-3
scheduler: cosine 
scheduler_kwargs:
  num_warmup_steps: 5_000
  num_training_steps: 50_000
num_warmup_steps: 5_000
num_training_steps: 50_000
weight_decay: 0.01
mask_token_id: 32
pad_token_id: 1
vocab_size: 33
ckpt_path: null
# Fresh-finetune from pretrained weights (model weights only — fresh
# optimizer, step counter, LR schedule). Distinct from `ckpt_path` (full
# Lightning resume) — setting both raises. Accepts a short name from
# the leflur registry (e.g. `leflur-base`, `leflur-ted`) which is
# resolved via `lobster.model.leflur.checkpoints.resolve_checkpoint`,
# or a literal path / HF URI. Wiring lives in `cmdline/train.py`.
pretrained_ckpt: null
# When loading from `pretrained_ckpt`, zero-out the encoder's
# `conditioning_embedding` layer so step 0 of finetune is identical to
# the source checkpoint (otherwise the layer carries the original init
# weights — non-zero — which inject a large arbitrary signal as soon as
# `cond_percentage > 0`). Recommended `true` for epitope-conditioning
# finetunes from a checkpoint that was trained with `cond_percentage=0`.
zero_init_conditioning_on_load: false
# Per-residue epitope conditioning probability. 0.0 = unconditional
# behaviour (backwards-compatible default). Set >0 only for finetunes
# on data that emits `epitope_tensor` (e.g. Pinder dimers via
# `BinderTargetTransform`). 0.5 is a sensible starting point for
# CFG-style classifier-free guidance training on a 50/50 monomer/dimer
# mix; the lightning module also randomly drops a fraction of
# nonzero epitope indices per example as a stochastic mask.
cond_percentage: 0.0
# Same pattern as `zero_init_conditioning_on_load` but for the per-residue
# chain-id embedding (Commit C). Set true on a finetune from a checkpoint
# that pre-dates chain embedding (e.g. leflur-base) so step 0 = source
# checkpoint identically. `padding_idx=0` row stays zero regardless.
zero_init_chain_embedding_on_load: false
# Per-residue TEMPLATE structure-token conditioning (leak-free per-chain templates).
# 0.0 (default) = disabled, no template layer, legacy checkpoints load unchanged.
# >0 provides templates that fraction of steps; within, uniform {both,one,none} chains,
# each templated chain's interface residues masked 50% of the time.
template_percentage: 0.0
encoder_kwargs:
  max_length: ${data.max_length}
  model_size: mini