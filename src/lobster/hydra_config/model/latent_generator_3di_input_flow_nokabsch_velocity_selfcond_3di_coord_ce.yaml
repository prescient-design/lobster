_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInputFlow

# Step Y -- velocity + self-cond + differentiable mini3di "3Di-CE-from-coords"
# auxiliary loss.
#
# Same backbone as `flow_nokabsch_velocity_selfcond` (the family Kab
# leader at ~14.0 A / 19% 3DR). Adds an aux loss that takes the
# data-space predicted Cα geometry, runs it through a torch port of
# the Foldseek mini3di pipeline (frozen Foldseek VAE weights + 20-state
# centroids, with the partner index frozen from GT), and computes
# cross-entropy against the GT 3Di tokens. Bit-for-bit equivalent to
# numpy mini3di on real PDB structures (verified by
# `scripts/_diag_test_mini3di_torch_equivalence.py`, 100% agreement on
# 30 val proteins / 5668 valid residues).
#
# Why distinct from the Step W `_distogram_3di` head:
#   * `_distogram_3di` puts a per-token MLP on the U-ViT features and
#     CE's against GT 3Di. On cond-branch samples the residual skip
#     carries the input 3Di embedding through, so the head can learn
#     the trivial inverse without shaping the coord predictions.
#   * THIS loss takes the predicted Cα coords directly through the
#     Foldseek pipeline. Gradient flows back through the geometry
#     (Cα → virtual center → descriptors → VAE → centroid distance)
#     so the coord head is shaped to land at the right 3Di token at
#     each residue. No trivial inverse path.
#
# Loss config:
#   aux_3di_coord_ce_weight = 0.10
#       Small relative to the velocity loss; the gradient through the
#       mini3di pipeline is sharp (steep cross-product / normalize ops),
#       so a heavier weight risks dominating the velocity gradient
#       early. We can crank up later if the run looks under-supervised.
#   aux_3di_coord_ce_t_lim = 0.5
#       Same gating as the distogram aux: predict 3Di only for the
#       clean-end half of the trajectory. At noisy t the predicted
#       coords are random; backpropping CE through random geometry just
#       pushes the model toward whatever 3Di state corresponds to noise,
#       which isn't useful.
#   aux_3di_coord_ce_temperature = 1.0
#       Softmax temperature for the 20-class centroid logits. 1.0 keeps
#       the soft-vs-hard mismatch small (the Foldseek-trained centroids
#       are well-separated in the 2-D VAE space, so sigmoid-sharp logits
#       at T=1 are already close to the argmax assignment).
#
# Resume from `velocity_selfcond` val-best (e1503, val=0.5378, the
# Phase 6 leader at the time of the experiment) -- the from-scratch
# variant would have to first re-learn the velocity_selfcond signal
# before the aux loss could pay off, and we already have that ckpt
# trained.

ckpt_path: null

n_atoms: 3
num_3di_classes: 20

p_uncond: 0.15
guidance_scale: 1.0
n_sampling_steps: 50
aux_pairwise_l2_weight: 0.01

# Step Y: differentiable mini3di pipeline on predicted Cα coords.
aux_3di_coord_ce_weight: 0.10
aux_3di_coord_ce_t_lim: 0.5
aux_3di_coord_ce_temperature: 1.0

center_x1: true
center_every_step: true

coord_scale: 0.1

random_so3_aug: true

sampling_mode: ode
sc_scale_noise: 0.0
sc_scale_score: 0.0

autoguidance_model: null
autoguidance_ratio: 0.0

use_self_conditioning: true
selfcond_train_prob: 0.5

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: []
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoderConditional
      data_fixed_size: 512
      n_atoms: 3
      uvit_n_layers: 6
      uvit_n_heads: 8
      uvit_dim_head: 32
      uvit_position_embedding_type: 'rotary'
      indexed: false
      struc_token_dim: 512
      struc_token_codebook_size: 512
      encode_ligand: false
      num_3di_classes: 20
      time_cond_dim: 128
      num_registers: 4
      use_self_conditioning: true

interpolant:
  _target_: bionemo.moco.interpolants.continuous_time.continuous.continuous_flow_matching.ContinuousFlowMatcher
  _partial_: true
  prediction_type: velocity
  sigma: 0.0
  augmentation_type: null
  data_scale: 1.0

time_distribution:
  _target_: bionemo.moco.distributions.time.uniform.UniformTimeDistribution
  min_t: 0.0
  max_t: 1.0

prior_distribution:
  _target_: bionemo.moco.distributions.prior.continuous.gaussian.GaussianPrior
  mean: 0.0
  std: 1.0
  center: false

inference_schedule:
  _target_: bionemo.moco.schedules.inference_time_schedules.LinearInferenceSchedule
  nsteps: 50

optim:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
