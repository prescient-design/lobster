_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInput

# Read by `lobster.cmdline.train` as `trainer.fit(..., ckpt_path=...)`.
# Set to a `last.ckpt` path to resume; leave as null for a fresh run.
ckpt_path: null

# 3Di alphabet has 20 states (mini3di / Foldseek). The pad index is one
# past the legal range (`num_3di_classes`), so the wrapped decoder's
# indexed embedding table needs `num_3di_classes + 1` rows.
num_3di_classes: 20

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: [l2_loss, pairwise_l2_loss]
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoder
      data_fixed_size: 512
      n_atoms: 3
      uvit_n_layers: 6
      uvit_n_heads: 8
      uvit_dim_head: 32
      uvit_position_embedding_type: 'rotary'
      # Take integer 3Di state IDs directly (indexed embedding lookup
      # inside the decoder); codebook size = num_3di_classes (20) + 1 pad.
      indexed: true
      struc_token_dim: 512
      struc_token_codebook_size: 21
      encode_ligand: false

loss_factory:
  _target_: lobster.model.latent_generator.tokenizer.LossFactory.from_mapping
  weight_dict:
    pairwise_l2_loss: 1.0
    l2_loss: 0.01
  loss_mapping:
    pairwise_l2_loss:
      _target_: lobster.model.latent_generator.tokenizer.PairWiseL2Loss
    l2_loss:
      _target_: lobster.model.latent_generator.tokenizer.L2Loss

optim:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

lr_scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
  num_training_steps: 50000
