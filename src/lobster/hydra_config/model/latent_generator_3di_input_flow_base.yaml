# BASE-size flow-matching 3Di-input decoder (Step G).
#
# Scale-up of the small (~21M) Tokenizer3diInputFlow to ~99M params
# (768d / 12L / 12h x 64dh). Matches the ESMFold2 DiffusionModule
# token-transformer width (c_token=768) at a similar block count, so
# the per-token attention is 3x wider than the small variant
# (inner_dim = 12 * 64 = 768 vs. 8 * 32 = 256).
#
# Self-conditioning is intentionally OFF here so this run isolates the
# scale-up effect from the self-cond effect:
#   - Existing baseline:    small  + plain (~21M, job 12478043).
#   - Step F new run:       small  + self-cond.
#   - Step G new run:       BASE   + plain.   <- this file.
# After both new runs report, a combined ``BASE + self-cond`` run is the
# natural "best of both" follow-up.
_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInputFlow

ckpt_path: null

n_atoms: 3
num_3di_classes: 20

p_uncond: 0.15
guidance_scale: 1.0
n_sampling_steps: 50
aux_pairwise_l2_weight: 0.01

center_x1: true
center_every_step: true

# Coordinate scaling: Angstrom -> nanometer (Proteina `nm_to_ang_scale=10.0`).
# See `latent_generator_3di_input_flow.yaml` for the full rationale.
coord_scale: 0.1

# Step H: per-step random SO(3) augmentation of `x_1` (train-only).
# See `latent_generator_3di_input_flow.yaml` for the full rationale.
# Particularly relevant for BASE: with ~5x the parameter count of the
# small variant, the model has the capacity to memorise canonical
# PDB orientations -- augmentation forces it to learn rotation-aware
# features instead.
random_so3_aug: true

sampling_mode: ode
sc_scale_noise: 0.0
sc_scale_score: 0.0

autoguidance_model: null
autoguidance_ratio: 0.0

# Step G keeps self-cond OFF for the isolated scale axis A/B.
use_self_conditioning: false
selfcond_train_prob: 0.5

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: []
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoderConditional
      data_fixed_size: 512
      n_atoms: 3
      # BASE knobs (98.7M params total per Step G sizing analysis):
      uvit_n_layers: 12
      uvit_n_heads: 12
      uvit_dim_head: 64
      uvit_position_embedding_type: 'rotary'
      indexed: false
      struc_token_dim: 768
      struc_token_codebook_size: 768
      encode_ligand: false
      num_3di_classes: 20
      # Bump time_cond_dim to match ESMFold2's ``fourier_dim=256`` at
      # ``c_token=768``. The downstream U-ViT FiLM layers are built with
      # the same dim so the gating sees a richer time signal proportional
      # to the residual-stream width.
      time_cond_dim: 256
      num_registers: 4
      use_self_conditioning: false

interpolant:
  _target_: bionemo.moco.interpolants.continuous_time.continuous.continuous_flow_matching.ContinuousFlowMatcher
  _partial_: true
  prediction_type: data
  sigma: 0.0
  augmentation_type: kabsch
  data_scale: 1.0

time_distribution:
  _target_: bionemo.moco.distributions.time.uniform.UniformTimeDistribution
  min_t: 0.0
  max_t: 1.0

prior_distribution:
  _target_: bionemo.moco.distributions.prior.continuous.gaussian.GaussianPrior
  mean: 0.0
  std: 1.0
  center: false

inference_schedule:
  _target_: bionemo.moco.schedules.inference_time_schedules.LinearInferenceSchedule
  nsteps: 50

optim:
  _target_: torch.optim.Adam
  _partial_: true
  # Constant 1e-4 after warmup for parity with the small variants (the A/B is
  # cleaner if the only difference vs. the small runs is model size, not LR).
  # The earlier muP-style 8e-5 was tied to the cosine-decay schedule; with a
  # flat schedule we hold all runs at 1e-4. Keep weight_decay at 0 for parity.
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

# Constant LR after a linear warmup (no decay). `num_training_steps` is
# intentionally omitted: `get_constant_schedule_with_warmup` does not accept
# it, and `configure_optimizers` filters scheduler kwargs by signature.
lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
