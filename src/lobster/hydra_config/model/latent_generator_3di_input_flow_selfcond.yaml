# Self-conditioned flow-matching 3Di-input decoder (Step F).
#
# Identical to ``latent_generator_3di_input_flow.yaml`` except:
#   - ``decoder.use_self_conditioning: true`` builds a second zero-initialised
#     coord input projection (``coord_in_proj_selfcond``).
#   - ``model.use_self_conditioning: true`` enables the warm no-grad forward
#     in ``_single_step`` (Karras / ESMFold2-style self-cond training trick)
#     and the carry-over of ``x_selfcond`` between sampling steps.
#   - ``model.selfcond_train_prob: 0.5`` controls the per-step probability
#     that the model is trained with a stale self-cond input (the rest of
#     the steps train with ``x_selfcond=None`` so the model stays robust
#     to the cold-start case at sampling step 0).
#
# Validated at the small size (~21M params) per the user-selected plan:
# self-conditioning lands first on the cheap model, BASE-size scale-up
# follows only after the self-cond run beats the baseline.
_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInputFlow

ckpt_path: null

n_atoms: 3
num_3di_classes: 20

p_uncond: 0.15
guidance_scale: 1.0
n_sampling_steps: 50
aux_pairwise_l2_weight: 0.01

center_x1: true
center_every_step: true

# Coordinate scaling: Angstrom -> nanometer (Proteina `nm_to_ang_scale=10.0`).
# See `latent_generator_3di_input_flow.yaml` for the full rationale.
coord_scale: 0.1

# Step H: per-step random SO(3) augmentation of `x_1` (train-only).
# See `latent_generator_3di_input_flow.yaml` for the full rationale.
# Compatible with self-conditioning: the warm no-grad forward and the
# grad forward both consume the same rotated x_t for that step, so
# the self-cond signal stays in-frame.
random_so3_aug: true

sampling_mode: ode
sc_scale_noise: 0.0
sc_scale_score: 0.0

autoguidance_model: null
autoguidance_ratio: 0.0

# Step F: self-conditioning (ESMFold2 borrow #1 from the plan).
use_self_conditioning: true
selfcond_train_prob: 0.5

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: []
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoderConditional
      data_fixed_size: 512
      n_atoms: 3
      uvit_n_layers: 6
      uvit_n_heads: 8
      uvit_dim_head: 32
      uvit_position_embedding_type: 'rotary'
      indexed: false
      struc_token_dim: 512
      struc_token_codebook_size: 512
      encode_ligand: false
      num_3di_classes: 20
      time_cond_dim: 128
      num_registers: 4
      # Step F: zero-initialised second coord projection that consumes
      # the previous denoised estimate. Must match the tokenizer's
      # ``use_self_conditioning`` flag; the tokenizer enforces this at
      # construction time.
      use_self_conditioning: true

interpolant:
  _target_: bionemo.moco.interpolants.continuous_time.continuous.continuous_flow_matching.ContinuousFlowMatcher
  _partial_: true
  prediction_type: data
  sigma: 0.0
  augmentation_type: kabsch
  data_scale: 1.0

time_distribution:
  _target_: bionemo.moco.distributions.time.uniform.UniformTimeDistribution
  min_t: 0.0
  max_t: 1.0

prior_distribution:
  _target_: bionemo.moco.distributions.prior.continuous.gaussian.GaussianPrior
  mean: 0.0
  std: 1.0
  center: false

inference_schedule:
  _target_: bionemo.moco.schedules.inference_time_schedules.LinearInferenceSchedule
  nsteps: 50

optim:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

# Constant LR after a linear warmup (no decay). `num_training_steps` is
# intentionally omitted: `get_constant_schedule_with_warmup` does not accept
# it, and `configure_optimizers` filters scheduler kwargs by signature.
lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
