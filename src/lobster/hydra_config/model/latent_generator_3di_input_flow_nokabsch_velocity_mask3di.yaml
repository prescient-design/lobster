_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInputFlow

# Step V: clone of `latent_generator_3di_input_flow_nokabsch_velocity.yaml`
# with per-residue 3Di masking enabled. At training, after the existing
# CFG full-drop check (p_uncond=0.15 fires once per sample), conditional
# samples (the remaining ~85%) get a per-sample mask rate `p ~ U(0, 1)`,
# and each residue's 3Di token is replaced by the null/pad index
# independently with probability `p`. Trains the decoder to handle
# PARTIAL 3Di conditioning at any coverage level -- at inference, the
# user can supply tokens for some residues and let the model fill in
# the rest.
#
# Borrows the moco discrete-flow / leflur masking pattern: per-token
# Bernoulli with rate ~ U(0, 1) per sample. NOT a fixed-rate per-token
# Bernoulli (which would only train the model at one mask rate ~= the
# fixed rate; we want it calibrated at every mask rate just like
# diffusion training is calibrated at every t).

ckpt_path: null

n_atoms: 3
num_3di_classes: 20

p_uncond: 0.15
guidance_scale: 1.0
n_sampling_steps: 50
aux_pairwise_l2_weight: 0.01

center_x1: true
center_every_step: true

coord_scale: 0.1

random_so3_aug: true

sampling_mode: ode
sc_scale_noise: 0.0
sc_scale_score: 0.0

autoguidance_model: null
autoguidance_ratio: 0.0

use_self_conditioning: false
selfcond_train_prob: 0.5

# Step V: per-residue 3Di masking on conditional samples.
mask_3di_per_residue: true

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: []
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoderConditional
      data_fixed_size: 512
      n_atoms: 3
      uvit_n_layers: 6
      uvit_n_heads: 8
      uvit_dim_head: 32
      uvit_position_embedding_type: 'rotary'
      indexed: false
      struc_token_dim: 512
      struc_token_codebook_size: 512
      encode_ligand: false
      num_3di_classes: 20
      time_cond_dim: 128
      num_registers: 4
      use_self_conditioning: false

interpolant:
  _target_: bionemo.moco.interpolants.continuous_time.continuous.continuous_flow_matching.ContinuousFlowMatcher
  _partial_: true
  prediction_type: velocity
  sigma: 0.0
  augmentation_type: null
  data_scale: 1.0

time_distribution:
  _target_: bionemo.moco.distributions.time.uniform.UniformTimeDistribution
  min_t: 0.0
  max_t: 1.0

prior_distribution:
  _target_: bionemo.moco.distributions.prior.continuous.gaussian.GaussianPrior
  mean: 0.0
  std: 1.0
  center: false

inference_schedule:
  _target_: bionemo.moco.schedules.inference_time_schedules.LinearInferenceSchedule
  nsteps: 50

optim:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
