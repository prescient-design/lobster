_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInputFlow

# Ablation -- weight=0 sibling of `base_3di_coord_ce`.
#
# Same architecture and config as the weight=0.10 base_3di_coord_ce
# variant, except `aux_3di_coord_ce_weight=0` so the differentiable
# mini3di CE-from-coords loss applies *no* gradient pressure on the
# coord head. The diagnostic (CE + argmax accuracy) is still tracked
# via the new `track_aux_3di_coord_ce=true` flag, so wandb panels
# stay populated and we can compare against the weight=0.10 champion
# without re-instrumenting metrics.
#
# Resume target: a `flow_nokabsch_velocity_base` checkpoint that
# predates the coord-CE loss entirely, so this run reflects "what
# would the BASE backbone do if we never added the coord-CE loss but
# kept training". Pinned in the slurm launcher (CKPT_RESUME).

ckpt_path: null

n_atoms: 3
num_3di_classes: 20

p_uncond: 0.15
guidance_scale: 1.0
n_sampling_steps: 50
aux_pairwise_l2_weight: 0.01

# Ablation: weight=0 disables the gradient. `track_aux_3di_coord_ce`
# keeps the diagnostic alive (computed under no_grad, logged each step).
aux_3di_coord_ce_weight: 0.0
aux_3di_coord_ce_t_lim: 0.5
aux_3di_coord_ce_temperature: 1.0
track_aux_3di_coord_ce: true

center_x1: true
center_every_step: true

coord_scale: 0.1

random_so3_aug: true

sampling_mode: ode
sc_scale_noise: 0.0
sc_scale_score: 0.0

autoguidance_model: null
autoguidance_ratio: 0.0

use_self_conditioning: false
selfcond_train_prob: 0.5

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: []
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoderConditional
      data_fixed_size: 512
      n_atoms: 3
      uvit_n_layers: 12
      uvit_n_heads: 12
      uvit_dim_head: 64
      uvit_position_embedding_type: 'rotary'
      indexed: false
      struc_token_dim: 768
      struc_token_codebook_size: 768
      encode_ligand: false
      num_3di_classes: 20
      time_cond_dim: 256
      num_registers: 4
      use_self_conditioning: false

interpolant:
  _target_: bionemo.moco.interpolants.continuous_time.continuous.continuous_flow_matching.ContinuousFlowMatcher
  _partial_: true
  prediction_type: velocity
  sigma: 0.0
  augmentation_type: null
  data_scale: 1.0

time_distribution:
  _target_: bionemo.moco.distributions.time.uniform.UniformTimeDistribution
  min_t: 0.0
  max_t: 1.0

prior_distribution:
  _target_: bionemo.moco.distributions.prior.continuous.gaussian.GaussianPrior
  mean: 0.0
  std: 1.0
  center: false

inference_schedule:
  _target_: bionemo.moco.schedules.inference_time_schedules.LinearInferenceSchedule
  nsteps: 50

optim:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
