_target_: lobster.model.latent_generator.tokenizer.Tokenizer3diInputFlow

# Step S: velocity-prediction variant of `..._flow_nokabsch.yaml`. Two
# changes vs. the data-pred sibling, both intentional:
#   1. `interpolant.prediction_type: velocity` -- the model now outputs
#      the FM vector field `v` directly (Proteina's `target_pred=v`).
#      moco's `step()` consumes `v` as-is for integration.
#   2. The loss `target_type` follows `prediction_type` (handled in
#      `_tokenizer_3di_input_flow.py::_moco_loss`), so the loss becomes
#      `||v_hat - (x_1 - x_0)||^2` with NO `1/(1-t)^2` reweight (vs. the
#      DATA-target loss which has it). This matches Proteina's v-mode
#      and directly addresses Step P Tier-1 (drop the reweight that
#      starves the low-t regime).
#
# The two changes are conflated by Proteina convention; if we later want
# to isolate the parametrization vs. reweight axis, the follow-up is a
# one-line override (`+model.flow_matcher.prediction_type=velocity` plus a
# `target_type=DATA` patch in `_moco_loss`).

ckpt_path: null

n_atoms: 3
num_3di_classes: 20

p_uncond: 0.15
guidance_scale: 1.0
n_sampling_steps: 50
aux_pairwise_l2_weight: 0.01

center_x1: true
center_every_step: true

coord_scale: 0.1

random_so3_aug: true

sampling_mode: ode
sc_scale_noise: 0.0
sc_scale_score: 0.0

autoguidance_model: null
autoguidance_ratio: 0.0

decoder_factory:
  _target_: lobster.model.latent_generator.structure_decoder.DecoderFactory.from_mapping
  decoder2loss_dict:
    vit_decoder: []
  decoder_mapping:
    vit_decoder:
      _target_: lobster.model.latent_generator.structure_decoder.ViTDecoderConditional
      data_fixed_size: 512
      n_atoms: 3
      uvit_n_layers: 6
      uvit_n_heads: 8
      uvit_dim_head: 32
      uvit_position_embedding_type: 'rotary'
      indexed: false
      struc_token_dim: 512
      struc_token_codebook_size: 512
      encode_ligand: false
      num_3di_classes: 20
      time_cond_dim: 128
      num_registers: 4

# Step S: velocity-prediction. The loss-side dispatch (`target_type`) is
# read from this `prediction_type` by `_moco_loss`, so flipping this to
# `velocity` is the only change the loss needs.
interpolant:
  _target_: bionemo.moco.interpolants.continuous_time.continuous.continuous_flow_matching.ContinuousFlowMatcher
  _partial_: true
  prediction_type: velocity
  sigma: 0.0
  augmentation_type: null
  data_scale: 1.0

time_distribution:
  _target_: bionemo.moco.distributions.time.uniform.UniformTimeDistribution
  min_t: 0.0
  max_t: 1.0

prior_distribution:
  _target_: bionemo.moco.distributions.prior.continuous.gaussian.GaussianPrior
  mean: 0.0
  std: 1.0
  center: false

inference_schedule:
  _target_: bionemo.moco.schedules.inference_time_schedules.LinearInferenceSchedule
  nsteps: 50

optim:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0

num_warmup_steps: 5000
num_training_steps: 50000

lr_scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5000
