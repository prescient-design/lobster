ForwardFoldingCallback:
  _target_: lobster.callbacks._forward_folding_callback.ForwardFoldingCallback
  structure_path: ${paths.output_dir}/structures/
  cameo_data_path: "/cv/data/ai4dd/data2/lisanzas/AFDB/valid_cameo_processed/*.pt"
  save_every_n: 20000
  num_samples: 50
  max_length: 512
  nsteps: 100
  # batch_size=1 => the callback generates at each structure's NATIVE length
  # (it uses max(coords in batch) as the sample length). Any batch_size>1
  # pads shorter structures up to the batch-max length, and masked padding
  # still corrupts flow-matching geometry (measured: CAMEO TM 0.18 padded
  # to 512 vs 0.67 native). Keep at 1 so training-time fwd-fold TM reflects
  # real folding quality, matching the eval pipeline.
  batch_size: 1
  # M-recipe: standardized across all forward-folding callbacks (matches the
  # monomer eval inference recipe; A/B tested equivalent to the 200/0.220/20
  # recipe on TM, and 2x faster at nsteps=100). nsteps set below.
  temperature_seq: 0.2967457760634187
  temperature_struc: 0.1102551183666233
  stochasticity_seq: 10
  stochasticity_struc: 30

  cache_dir: null

