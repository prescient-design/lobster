# Protein-Ligand Inverse Folding Callback
# Evaluates ligand-conditioned vs unconditioned inverse folding
#
# Key Question: Does providing ligand context improve sequence recovery
# for binding pocket residues?
#
# Tracks:
# - aar_overall_*: Overall amino acid recovery
# - aar_pocket_*: Pocket-only recovery (residues within threshold of ligand)
# - aar_nonpocket_*: Non-pocket recovery
# - *_delta: Improvement from providing ligand context
#
# Usage in experiment config:
#   defaults:
#     - override /callbacks: gen_ume_protein_ligand
#   callbacks:
#     protein_ligand_inverse_folding:
#       save_every_n: 5000

protein_ligand_inverse_folding:
  _target_: lobster.callbacks.ProteinLigandInverseFoldingCallback
  data_dir: /data2/lisanzas/pdb_bind_12_15_25/test/
  structure_path: ${paths.output_dir}/protein_ligand_eval/
  save_every_n: 5000
  num_samples: 100  # Use subset for speed during training
  pocket_distance_threshold: 5.0  # Å - residues within this distance of ligand are "pocket"
  nsteps: 100  # Diffusion steps for generation
  metric_prefix: protein_ligand_inverse_folding
