# S3 Checkpoint Backup Callback Configuration
#
# Add to your training config to automatically backup checkpoints to S3:
#   callbacks:
#     defaults:
#       - s3_backup
#
# Or override settings:
#   +callbacks.s3_backup.upload_every_n_epochs=5
#
s3_backup:
  _target_: lobster.callbacks._s3_checkpoint_callback.S3CheckpointBackupCallback
  s3_bucket: "prescient-pcluster-data"
  s3_prefix: "gen_ume/checkpoints"
  project_name: ${logger.project}  # Uses the WandB project name
  upload_every_n_epochs: 10
  upload_best_only: false
  upload_last: true
  dry_run: false

