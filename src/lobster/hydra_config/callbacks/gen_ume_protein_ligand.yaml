# Callbacks for Gen-UME Protein-Ligand training
# Includes structure decoding, inverse folding, and protein-ligand complex visualization

defaults:
  - model_checkpoint.yaml
  - lr_monitor.yaml
  - progress_bar.yaml
  - structure_decode.yaml
  - inverse_folding.yaml
  - protein_ligand_decode.yaml
  - _self_


# Best checkpoints by validation loss
model_checkpoint:
  dirpath: ${paths.output_dir}
  filename: "{epoch}-{step}-{val_loss:.4f}"
  monitor: val_loss
  save_top_k: 3
  mode: min
  verbose: true
  save_last: false  # Disabled - using last_checkpoint callback instead

# Keep last N checkpoints regardless of val_loss (crash recovery)
last_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}
  filename: "last-{epoch}-{step}"
  monitor: step
  mode: max
  save_top_k: 3
  verbose: true
  every_n_train_steps: 1000  # Save every 1000 steps

structure_decode:
  structure_path: "${paths.output_dir}/structures/"
  save_every_n: 1000

InverseFoldingCallback:
  structure_path: ${paths.output_dir}/structures/
  save_every_n: 2000
  dataset_name: cath
  metric_prefix: inverse_folding_cath
  length: 100
  num_samples: 10
  use_plm_fold: false  # Disable ESMFold for speed during initial training

protein_ligand_decode:
  structure_path: "${paths.output_dir}/structures/"
  save_every_n: 1000
  save_separate: false
