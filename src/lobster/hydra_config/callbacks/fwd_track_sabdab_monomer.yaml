# Tracking callback: SAbDab monomer forward folding (each SAbDab-val chain
# folded ALONE -- antibody VH+VL is stored under a single chain id, so it
# folds as one monomer; antigen as the other). M-recipe, metrics only.
# Data pre-split from SAbDab val by
# scripts/_diag_split_pinder_val_to_monomer_pts.py.
FwdTrackSabdabMonomer:
  _target_: lobster.callbacks._forward_folding_callback.ForwardFoldingCallback
  structure_path: null
  cameo_data_path: "/cv/scratch/u/lisanzas/sabdab_atom14_val_monomers/*.pt"
  save_every_n: 20000
  num_samples: 50
  max_length: 512
  nsteps: 100
  batch_size: 1
  temperature_seq: 0.2967457760634187
  temperature_struc: 0.1102551183666233
  stochasticity_seq: 10
  stochasticity_struc: 30
  cache_dir: null
  use_chain_ids: false
  use_epitope_conditioning: false
  metric_prefix: "fwd_sabdab_monomer"
  max_length_filter: 512
  min_chains: 1
