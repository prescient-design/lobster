# @package generation
mode: inverse_folding
nsteps: 100

# Generation parameters (structure is fixed, only sequence varies)
temperature_seq: 0.5
stochasticity_seq: 20
batch_size: 4  # Number of structures to process in parallel

# ESMFold validation
use_esmfold: true
max_length: 512

# Input structures for inverse folding
# Can be:
# - Single PDB file: "/path/to/structure.pdb"
# - Directory: "/path/to/pdb/directory/"
# - Glob pattern: "/path/to/structures/*.pdb"
# - List of files: ["/path/to/file1.pdb", "/path/to/file2.pdb"]
input_structures: null  # Must be provided via command line or config override

# Not used for inverse folding
length: null
num_samples: null
temperature_struc: null
stochasticity_struc: null
