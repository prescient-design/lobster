# @package generation
mode: unconditional
length: 100
num_samples: 10
nsteps: 200

# Generation parameters
temperature_seq: 0.5
temperature_struc: 1.0
stochasticity_seq: 20
stochasticity_struc: 20

# ESMFold validation
use_esmfold: true
max_length: 512

# Not used for unconditional generation
input_structures: null
